<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор представителя владельца лицевого счета</title>
    <script src="./api.js"></script>
    <link rel="icon" href="data:,">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app" class="page-wrapper">
      <header class="page-header">
        <h1>Введите инициалы представителя владельца лицевого счета</h1>
        <div id="error" class="error-message" v-if="error">{{ error }}</div>
      </header>
      <main class="content-card">
        <input v-model="name" placeholder="ФИО представителя владельца" class="form-input" :disabled="showContinue">
        <input v-model="phone" maxlength="20" placeholder="номер телефона представителя" class="form-input" :disabled="showContinue">
        <input v-model="mail" maxlength="20" autocomplete="off" placeholder="адрес электронной почты представителя" class="form-input" :disabled="showContinue">
        <section class="actions-section">
          <button @click="saveRepresentative" class="btn-primary" v-if="!showContinue">Продолжить</button>            
          <button @click="handleExpiredSession" id="ContinueButton" class="btn-secondary ContinueButton" v-if="showContinue">Продолжить</button>            
          <button onclick="logout()" id="changebutton" class="btn-secondary" v-if="!showContinue">Назад</button>
        </section>
      </main>
      <div class="status" id="statusDiv"></div>
    </div>
  </body>

  <script>
    const {createApp, ref, onMounted} = Vue;
    createApp({
      setup() {
        const showContinue = ref(false);
        const name = ref('');
        const phone = ref('');
        const mail = ref('');
        const error = ref('');
        onMounted(() => {
            checkSession();
        });
        const saveRepresentative = async () => {
          error.value = '';
          if(!name.value.trim()) {
            error.value = 'Введите имя';
            return;
          }
          try {
            const result = await apiRequest('/add-representative', {
              name: name.value.trim(),
              phone: phone.value.trim() || null,
              mail: mail.value.trim() || null
            });
            if (result.status === 'OK') {
              sessionStorage.setItem('representative', JSON.stringify({
                id: result.id,
                name: name.value.trim(),
                phone: phone.value.trim(),
                mail: mail.value.trim()
              }));
              window.location.href = 'BoilerWindow.html';        
            } else {
              error.value = result.error;
            }
          } catch (err) {
            error.value = 'Ошибка: ' + (err.message);
            console.error('Error:', err);        
          }
        };
        const checkSession = () => {
          const authData = getAuthData ? getAuthData() : JSON.parse(sessionStorage.getItem('authData'));
          if (!authData) {
            error.value = 'Сессия не найдена';
            showContinue.value = true;
            setTimeout(() => window.location.href = 'index.html', 2000);
            return false;
          }
          const now = Date.now();
          const EXPIRY_MS = 2400000;
          if (now - authData.authDate > EXPIRY_MS) {
            error.value = 'Истёк срок сессии';
            showContinue.value = true;
            sessionStorage.setItem('lastAuthDate', authData.authDate);
            return false;
          }
          showContinue.value = false;
          return true;
        };
        const handleExpiredSession = () => {
          sessionStorage.removeItem('authData');
          window.location.href = 'oldtokenwindow.html';
        };
        return {
          name,
          phone,
          mail,
          error,
          showContinue,
          saveRepresentative,
          handleExpiredSession
        };
      }
    }).mount('#app');
  </script>
  <script>
    function logout() {
      window.location.href = 'checkownerwindow.html';
    }
  </script>
  <script>
    let statusTimeout;    
    let isInitialLoad = true;
    function updateStatus(isOnline) {
      var statusDiv = document.getElementById("statusDiv");
      if (!statusDiv) return;
      clearTimeout(statusTimeout);
      if (isOnline) {
        if (!isInitialLoad) {
          statusDiv.style.backgroundColor = "#44ff00";
          statusDiv.textContent = "Подключено";
          statusDiv.classList.remove("status-hidden");        
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
      } else {
        statusDiv.style.backgroundColor = "#ff0007";
        statusDiv.textContent = "Нет подключения";
        statusDiv.classList.remove("status-hidden");
        statusTimeout = setTimeout(function() {
          statusDiv.classList.add("status-hidden");
        }, 5000);
      }
      isInitialLoad = false;
    }   
    updateStatus(navigator.onLine);
    window.addEventListener("online", () => updateStatus(true));
    window.addEventListener("offline", () => updateStatus(false));
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      width: 100%;
      padding: 20px 16px;
    }

    .page-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 16px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 15px;
      color: #C62828;
      min-height: 22px;
      text-align: center;
      font-weight: 500;
    }

    .content-card {
      width: 100%;
      max-width: 480px;
      border: 2px solid #45B0E1;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .address-section {
      padding: 16px 20px;
      background-color: #D1D1D1;
      border-bottom: 2px solid #45B0E1;
    }

    .address-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .address-row:last-child {
      margin-bottom: 0;
    }

    .address-part {
      font-size: 18px;
      font-weight: 600;
      color: #000000;
      word-break: break-word;
    }

    .meters-section {
      padding: 16px 20px;
      background-color: #FFFFFF;
    }

    .meters-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      color: #000000;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input::placeholder {
      color: #666666;
    }

    .form-input:focus {
      border-color: #2E8BC0;
    }

    .meter-block {
      border: 2px solid #45B0E1;
      padding: 16px;
      background-color: #FFFFFF;
      transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }

    .meter-block.selected {
      border-color: #2E8BC0;
      background-color: #F0F9FC;
      border-width: 3px;
    }

    .meter-block h4 {
      font-size: 17px;
      font-weight: 600;
      color: #000000;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 2px solid #D1D1D1;
      padding-bottom: 8px;
    }

    .meter-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .detail-label {
      font-size: 16px;
      color: #333333;
      font-weight: 500;
    }

    .detail-value {
      font-size: 17px;
      color: #000000;
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      min-width: 120px;
    }

    .select-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #45B0E1;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .select-btn:hover {
      background-color: #F0F9FC;
    }

    .select-btn:active {
      background-color: #E0F4FA;
    }

    .select-btn:disabled {
      background-color: #F5F5F5;
      border-color: #CCCCCC;
      color: #999999;
      cursor: not-allowed;
    }

    .no-meters {
      text-align: center;
      color: #C62828;
      font-size: 16px;
      font-weight: 500;
      padding: 12px;
    }

    .actions-section {
      padding: 16px 20px 24px; 
      background-color: #D1D1D1; 
      border-top: 2px solid #45B0E1;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 12px;
    }

    .action-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    button {
      width: 100%;
      max-width: 320px;
      min-height: 56px;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      text-align: center;
      touch-action: manipulation;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .btn-secondary:active {
      background-color: #E0F4FA;
    }

    .ContinueButton {
      visibility: visible;
    }

    .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
      
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      .page-header h1 {
        font-size: 22px;
      }
      
      .content-card {
        padding: 0;
      }
      
      .address-section,
      .meters-section,
      .actions-section {
        padding: 14px 16px;
      }
      
      .address-part {
        font-size: 17px;
      }
      
      .detail-label {
        font-size: 15px;
      }
      
      .detail-value {
        font-size: 16px;
      }
      
      .select-btn {
        min-height: 44px;
        font-size: 15px;
      }
      
      button {
        min-height: 52px;
        font-size: 17px;
        max-width: 100%;
      }
    }

    @media (max-width: 360px) {
      .detail-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      
      .detail-value {
        text-align: left;
        width: 100%;
      }
    }
  </style>
</html>
