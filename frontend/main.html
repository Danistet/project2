<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="WIN1251">
        <title>Главная страница</title>
        <script src="./api.js"></script>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>

    <body>
        <h1>Главная страница</h1>
        <h2>
            <span id="streettype"></span>
            <span id="street"></span>           
            <span id="house"></span>
            <span id="apparts"></span>
            <p id="error" style="color: rgb(243, 66, 66);"></p> 
        </h2>          
        <div>
            <p>Серийный номер:</p>
            <p id="meterNum"></p>
            <p>Дата установки: </p>
            <p id="mountDate"></p>
            <p>дата проверки счетчика:</p>
            <p id="verifyDate"></p>
        </div>
        <div>
            <button onclick="cont()" id="ContinueButton" class="ContinueButton">продолжить</button><br>
            <button onclick="info()" id="infbt">Показания</button><br>
            <button onclick="logout()" id="changebutton">Сменить адрес</button>
        </div>
        <script>
        function loadAddressDisplay() {//////////////////////differrent meters
        const addressData = JSON.parse(sessionStorage.getItem('userAddress'));
            if (addressData) {
                document.getElementById('streettype').textContent = addressData.street?.split(' ')[0] || '';
                document.getElementById('street').textContent = addressData.street?.split(' ').slice(1).join(' ') || addressData.street || '';
                document.getElementById('house').textContent = addressData.house || '';
                document.getElementById('apparts').textContent = addressData.apparts || '';
                document.getElementById('apparts').textContent = 
                addressData.apparts && addressData.apparts !== "-1" ? addressData.apparts : '';
            }
        }

            document.addEventListener('DOMContentLoaded', () => {
            initPage();
            loadAddressDisplay();
            });
            function initPage() {
                const authData = JSON.parse(sessionStorage.getItem('authData'));
                const errorElement = document.getElementById('error');
                const continueButton = document.getElementById('ContinueButton');
                const infoButton = document.getElementById('infbt');
                const changebutton = document.getElementById('changebutton');
                if (!authData) {
                    errorElement.textContent = 'Сессия не найдена';
                    continueButton.style.display = 'visible';
                    infoButton.style.display = 'hidden';

                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    const now = Date.now();
                    const EXPIRY_MS = 1200000;
    
                    if (now - authData.authDate > EXPIRY_MS) {
                        errorElement.textContent = 'Истёк срок сессии';
                        continueButton.style.display = 'visible';
                        infoButton.style.display = 'none';
                        changebutton.style.display = 'none';                                      
                        sessionStorage.setItem('reauthPhone', authData.phone);
                        sessionStorage.setItem('lastAuthDate', authData.authDate);
                    } else {    
                        continueButton.style.display = 'none';
                        infoButton.style.display = 'visible';
                    }
                    loadMeterData();
                }
            }

            async function loadMeterData() {                
                const storedMeterData = sessionStorage.getItem('meternum');
                const storedMountData = sessionStorage.getItem('mountdate');
                const storedVerifyDate = sessionStorage.getItem('verifydate');
                const addressData = JSON.parse(sessionStorage.getItem('userAddress'));
                if (!storedMeterData && addressData?.g_licschet) {
                    console.log(addressData.g_licschet);
                }
                const meterNumElement = document.getElementById('meterNum');
                const mountDateElement = document.getElementById('mountDate');
                const verifyDateElement = document.getElementById('verifyDate');
                const errorElement = document.getElementById('error');

                if (storedMeterData && storedMountData) {
                    try {
                        const meterObj = JSON.parse(storedMeterData);
                        const mountObj = JSON.parse(storedMountData);
                        const verifyObj = JSON.parse(storedVerifyDate);
                        const mNum = meterObj.meterNum || 'Не указан';
                        const mDate = mountObj.mountDate ? new Date(mountObj.mountDate).toLocaleDateString('ru-RU') : 'Не указана';
                        const mVDate = verifyObj.verifyDate ? new Date(verifyObj.verifyDate).toLocaleDateString('ru-RU') : 'Не указана';
                        meterNumElement.textContent = mNum;
                        mountDateElement.textContent = mDate; 
                        verifyDateElement.textContent = mVDate;               
                    } catch (e) {
                        console.error("Ошибка данных счетчика:", e);
                        errorElement.textContent = 'Ошибка формата данных счетчика';
                    }
                } else {
                    console.log("Данные счетчика не найдены");
                }
            }

            function logout() {               
                window.location.href = 'address.html';
            }

            function info() {
                window.location.href = 'metervaluewindow.html';
            }

            function cont() {
                sessionStorage.removeItem('authData');
                window.location.href = 'oldtokenwindow.html';
            }
        </script>     
    </body>

    <style>
        body 
        {
            margin: 0;
            color: goldenrod;
            background-color: rgb(56, 54, 54);
            font-size: 24px;
            justify-content: center;
            justify-items: center;
            white-space: nowrap;
        }
        p
        {
            color: blueviolet;
            white-space: nowrap;
            font-size: 19px;
        }
        span
        {
            color: blueviolet;
        }
        button 
        {
            background-color: aqua;
            width: 177px;
            justify-content: center;
            justify-items: center;
        }
        select
        {
            background-color: aqua;
            width: 177px;
            justify-content: center;
            justify-items: center;
        }
        div
        {
            justify-content: center;
            justify-items: center;
            white-space: nowrap;
        }
        .ContinueButton
        {
            visibility: visible;
        }
        .search
        {
            background-color: aqua;
            width: 177px;
            justify-content: center;
            justify-items: center;
        }
        h2
        {
            white-space: nowrap;
        }
    </style>
</html>
