<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формирование списка</title>
    <link rel="icon" href="data:,">
    <script src="./vendor/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Формирование списка</h1>
      <form @submit.prevent="saveVerifyDate" :style="{ opacity: isLoading ? 0.5 : 1, pointerEvents: isLoading ? 'none' : 'auto' }">
        <div class="form-group">
          <label class="form-label checkbox-label" :class="{ disabled: !isOnline || isLoading }">
            <input type="checkbox" :disabled="!isOnline || isLoading" id="allmeters" v-model="showAllAddresses" class="form-checkbox">
            <span class="checkbox-text">Все адреса</span>
          </label>              
          <label for="streetInput" class="form-label">Улица</label>
          <div class="custom-datalist" :class="{ disabled: isLoading || streets.length === 0 }">
            <div class="custom-datalist-input-wrapper">
              <input
                type="text" id="streetInput"
                placeholder="Введите улицу"
                autocomplete="off"
                v-model="streetSearch" 
                class="form-input custom-datalist-input" 
                :disabled="isLoading || streets.length === 0"
                @focus="isStreetOpen = true"
                @blur="closeStreet"
                @input="isStreetOpen = true"
              >
              <span 
                v-if="streetSearch" 
                class="clear-input-btn" 
                @mousedown.prevent="clearStreet"
              >✕</span>
              <span class="custom-datalist-arrow" :class="{ open: isStreetOpen }">▼</span>
            </div>
            <div v-if="isStreetOpen && filteredStreets.length" class="custom-datalist-dropdown">
              <div 
                v-for="street in filteredStreets" 
                :key="street.id" 
                class="custom-datalist-option"
                @mousedown.prevent="selectStreet(street)"
              >
                {{ street.name }}
              </div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="houseInput" class="form-label">Дом</label>
          <div class="custom-datalist" :class="{ disabled: isLoading || !selectedStreetId }">
            <div class="custom-datalist-input-wrapper">
              <input
                type="text" id="houseInput"
                placeholder="Введите номер дома"
                autocomplete="off"
                v-model="houseSearch" 
                class="form-input custom-datalist-input" 
                :disabled="isLoading || !selectedStreetId"
                @focus="isHouseOpen = true"
                @blur="closeHouse"
                @input="isHouseOpen = true"
              >
              <span 
                v-if="houseSearch" 
                class="clear-input-btn" 
                @mousedown.prevent="clearHouse"
              >✕</span>
              <span class="custom-datalist-arrow" :class="{ open: isHouseOpen }">▼</span>
            </div>
            <div v-if="isHouseOpen && filteredBuildings.length" class="custom-datalist-dropdown">
              <div 
                v-for="bld in filteredBuildings" 
                :key="bld.id" 
                class="custom-datalist-option"
                @mousedown.prevent="selectHouse(bld)"
              >
                {{ bld.name }}
              </div>
            </div>
          </div>
        </div>  
        <label class="form-label checkbox-label" :class="{ disabled: isLoading }">
          <input type="checkbox" id="onlyWithoutDate" v-model="showOnlyWithoutDate" :disabled="isLoading" class="form-checkbox">
          <span class="checkbox-text">Адреса без назначенной даты посещения</span>
        </label>
        <div class="form-group">
          <label for="listInput" class="form-label">Список адресов</label>
          <div class="custom-datalist" :class="{ disabled: isLoading || !selectedBuildingId }">
            <div class="custom-datalist-input-wrapper">
              <input
                type="text" id="listInput"
                placeholder="Выберите адрес из списка"
                autocomplete="off"
                v-model="selectedAddressText" 
                class="form-input custom-datalist-input" 
                :disabled="isLoading || !selectedBuildingId"
                @focus="isListOpen = true"
                @blur="closeList"
                @input="isListOpen = true"
              >
              <span 
                v-if="selectedAddressText" 
                class="clear-input-btn" 
                @mousedown.prevent="clearList"
              >✕</span>
              <span class="custom-datalist-arrow" :class="{ open: isListOpen }">▼</span>
            </div>
            <div v-if="isListOpen && filteredAddresses.length" class="custom-datalist-dropdown">
              <div 
                v-for="addr in filteredAddresses" 
                :key="addr.meterId" 
                class="custom-datalist-option"
                @mousedown.prevent="selectAddress(addr)"
              >
                {{ addr.displayText }}
              </div>
            </div>
          </div>
        </div>
        <div v-if="selectedAddress" class="meter-block selected">
          <h4>Выбранный объект</h4>
          <div class="meter-details">
            <div class="detail-row">
              <span class="detail-label">Адрес:</span>
              <span class="detail-value">{{ selectedAddress.displayText }}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Дата проверки:</span>
              <input v-model="editData.verifyDate" type="date" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-row">
              <span class="detail-label">Ответственный контролёр</span>
              <select v-model="editData.controllerId" class="edit-input" :disabled="saving || controllers.length === 0">
                <option :value="null">Нет</option>
                <option v-for="ctrl in controllers" :key="ctrl.ID" :value="ctrl.ID">
                  {{ ctrl.FIO }}
                </option>
              </select>
            </div>
            <div v-if="showNoReadings && noReadingsMonths >= 1 && noReadingsMonths < 120" class="detail-row">
              <span class="detail-label" style="margin: 0;">Не передавали показания более</span>
              <input
                type="number"
                id="noReadingsMonths"
                v-model.number="noReadingsMonths"
                min="1"
                max="120"
                class="edit-input"
                :disabled="saving"
                readonly
              >
              <span class="detail-label" style="margin: 0;">месяцев</span>
            </div>
            <button type="submit" class="save-btn" :disabled="saving" v-if="!showContinue">
              {{ saving ? 'Сохранение...' : 'Сохранить' }}
            </button>
          </div>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" v-model="checkType" value="planned" :disabled="isLoading" />
              <span>Плановая</span>
            </label>
            <label class="radio-label">
              <input type="radio" v-model="checkType" value="unscheduled" :disabled="isLoading" />
              <span>Внеплановая</span>
            </label>
          </div>
        </div>  
        <div v-if="showContinue" class="session-expired-block">
          <p class="error-message">{{ error }}</p>
          <button @click="cont" class="btn-primary">Продолжить</button>
        </div>
        <button type="button" @click="continueAction" class="btn-primary" style="margin-top: 10px;" v-if="!showContinue">Продолжить</button>
        <button type="button" @click="viewhistory" class="btn-secondary" v-if="!showContinue">история работ</button>
        <button type="button" @click="logout" class="btn-secondary" v-if="!showContinue">Выход</button>
      </form>
      <div class="status" id="statusDiv"></div>
    </div>
    <script>
      (function () {
        if (typeof window.getControllerPackage === 'function') {
          return;
        }
        const DB_NAME = 'MeterOfflineStorage';
        const STORE_NAME = 'pendingReadings';
        const CONTROLLER_PACKAGE_STORE = 'controllerPackages';
        const DB_VERSION = 4;
        function openLocalDB() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onupgradeneeded = (event) => {
              const db = event.target.result;
              if (db.objectStoreNames.contains('pendiReadings')) {
                db.deleteObjectStore('pendiReadings');
              }
              if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, {
                  keyPath: 'id',
                  autoIncrement: true
                });
              }
              if (!db.objectStoreNames.contains(CONTROLLER_PACKAGE_STORE)) {
                db.createObjectStore(CONTROLLER_PACKAGE_STORE, {
                  keyPath: 'controllerId'
                });
              }
            };
            request.onsuccess = (event) => resolve(event.target.result);
            request.onerror = (event) => reject(event.target.error);
          });
        }
        window.getControllerPackage = async function (controllerId) {
          const db = await openLocalDB();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([CONTROLLER_PACKAGE_STORE], 'readonly');
            const store = transaction.objectStore(CONTROLLER_PACKAGE_STORE);
            const request = store.get(Number(controllerId));
            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
          });
        };
        window.saveControllerPackage = async function (controllerId, packageData) {
          const db = await openLocalDB();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([CONTROLLER_PACKAGE_STORE], 'readwrite');
            const store = transaction.objectStore(CONTROLLER_PACKAGE_STORE);
            const request = store.put({
              controllerId,
              savedAt: Date.now(),
              ...packageData
            });
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        };
        window.savePendingVerifyUpdate = async function (updateData) {
          const db = await openLocalDB();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.add({
              type: 'verifyUpdate',
              meterId: updateData.meterId,
              verifyDate: updateData.verifyDate,
              controllerId: updateData.controllerId,
              timestamp: Date.now()
            });
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        };
        window.getPendingVerifyUpdates = async function () {
          const db = await openLocalDB();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => {
              const all = request.result || [];
              resolve(all.filter(r => r.type === 'verifyUpdate'));
            };
            request.onerror = () => reject(request.error);
          });
        };
        window.deletePendingVerifyUpdate = async function (id) {
          const db = await openLocalDB();
          return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
          });
        };
        window.updateLocalMeterCache = async function (meterId, verifyDate, controllerId) {
          try {
            const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
            const currentControllerId = sessionStorage.getItem('controllerId') || authData.controllerId;
            if (!currentControllerId) return;
            const pkg = await window.getControllerPackage(currentControllerId);
            if (!pkg || !Array.isArray(pkg.meters)) return;
            const meter = pkg.meters.find(m => String(m.ID) === String(meterId));
            if (meter) {
              if (verifyDate !== undefined) meter.VERIFY_DATE = verifyDate;
              if (controllerId !== undefined) {
                meter.CONTROLER_ID = controllerId;
              }
              await window.saveControllerPackage(currentControllerId, pkg);
            }
          } catch (e) {
            console.warn('Не удалось обновить локальный кэш счётчика:', e);
          }
        };
        window.syncPendingVerifyUpdates = async function () {
          if (!navigator.onLine) return;
          const updates = await window.getPendingVerifyUpdates();
          if (updates.length === 0) return;
          console.log(`Найдено ${updates.length} отложенных обновлений даты проверки`);
          for (const upd of updates) {
            try {
              if (typeof updateVerifyDate === 'function') {
                await updateVerifyDate(upd.meterId, upd.verifyDate);
              } else {
                await apiRequest('/update-verify-date', { meterId: upd.meterId, verifyDate: upd.verifyDate });
              }
              if (upd.controllerId) {
                await apiRequest('/update-meter-controller', {
                  meterId: upd.meterId,
                  controllerId: upd.controllerId
                });
              }
              await window.updateLocalMeterCache(upd.meterId, upd.verifyDate, upd.controllerId);
              await window.deletePendingVerifyUpdate(upd.id);
              console.log(`Обновление даты проверки ID ${upd.id} синхронизировано`);
            } catch (err) {
              console.error(`Ошибка синхронизации обновления ID ${upd.id}:`, err);
            }
          }
        };
      })();
    </script>
    <script>
      const { createApp, ref, onMounted, onUnmounted, watch, computed } = Vue;
      createApp({
        setup() {
          const showContinue = ref(false);
          const showOverlay = ref(true);
          const actNo = ref('');
          const actDate = ref('');
          const checkType = ref('planned');
          const error = ref('');
          const isLoading = ref(false);
          const isOnline = ref(navigator.onLine);
          const saving = ref(false);
          const allAddresses = ref([]);
          const streets = ref([]);
          const buildings = ref([]);
          const filteredAddressList = ref([]);
          const showOnlyWithoutDate = ref(false);
          const showNoReadings = ref(true);
          const noReadingsMonths = ref(3);
          const selectedStreetId = ref(null);
          const streetSearch = ref('');
          const selectedBuildingId = ref(null);
          const houseSearch = ref('');
          const selectedAddressText = ref('');
          const selectedAddress = ref(null);
          const controllers = ref([]);
          const showAllAddresses = ref(false);
          const editData = ref({ meterId: null, verifyDate: '', controllerId: null });
          const isStreetOpen = ref(false);
          const isHouseOpen = ref(false);
          const isListOpen = ref(false);
          const calculateMonthsSinceLastReading = (dateStr) => {
            if (!dateStr || String(dateStr).trim() === '') {
              return 120;
            }
            const lastDate = new Date(dateStr);
            const now = new Date();
            if (isNaN(lastDate.getTime())) return 120;
            let months = (now.getFullYear() - lastDate.getFullYear()) * 12;
            months -= lastDate.getMonth();
            months += now.getMonth();
            return months <= 0 ? 0 : months;
          };
          watch(selectedAddress, (newAddr) => {
            if (newAddr) {
              const months = calculateMonthsSinceLastReading(newAddr.lastIndDate);
              noReadingsMonths.value = months;
            }
          });
          watch(showAllAddresses, async (newVal) => {
            if (!navigator.onLine && newVal === true) {
              showAllAddresses.value = false;
              if (typeof showAlert === 'function') {
                showAlert('Просмотр всех адресов доступен только при подключении к интернету', 'info');
              } else {
                alert('Просмотр всех адресов доступен только при подключении к интернету');
              }
            }
            filteredAddressList.value = [];
            selectedBuildingId.value = null;
            houseSearch.value = '';
            selectedAddressText.value = '';
            selectedAddress.value = null;
            await loadData();
            if (
              selectedStreetId.value &&
              !streets.value.some(s => String(s.id) === String(selectedStreetId.value))
            ) {
              selectedStreetId.value = null;
              streetSearch.value = '';
              buildings.value = [];
              houseSearch.value = '';
              filteredAddressList.value = [];
              selectedAddress.value = null;
              selectedAddressText.value = '';
            }
          });
          watch(showOnlyWithoutDate, () => {
            selectedAddress.value = null;
            selectedAddressText.value = '';
            isListOpen.value = false;
          });
          const loadData = async () => {
            isLoading.value = true;
            error.value = '';           
            if (!navigator.onLine && showAllAddresses.value) {
              showAllAddresses.value = false;
            }          
            try {
              const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
              const controllerId = sessionStorage.getItem('controllerId') || authData.controllerId;            
              if (!controllerId) {
                error.value = 'Не найден ID контроллера. Выполните вход заново.';
                return;
              }
              let data = [];
              if (showAllAddresses.value) {
                if (!navigator.onLine) {
                  showAllAddresses.value = false;
                  data = await getOfflineAddresses(controllerId);
                } else {
                  try {
                    data = await apiRequest('/all-addresses', {});
                  } catch (e) {
                    console.warn('Ошибка сети при загрузке всех адресов, переход в офлайн', e);
                    data = await getOfflineAddresses(controllerId);
                  }
                }
              } else {
                if (!navigator.onLine) {
                  data = await getOfflineAddresses(controllerId);
                } else {
                  try {
                    data = await getControllerAddresses(controllerId);
                  } catch (e) {
                    console.warn('Ошибка сети, загрузка из офлайн-кэша', e);
                    data = await getOfflineAddresses(controllerId);
                  }
                }
              }                        
              allAddresses.value = data || [];
              const streetMap = new Map();
              allAddresses.value.forEach(addr => {
                if (!streetMap.has(addr.streetId)) {
                  streetMap.set(addr.streetId, addr.streetName);
                }
              });
              streets.value = Array.from(streetMap, ([id, name]) => ({ id, name }));
            } catch (err) {
              console.error(err);
              error.value = 'Ошибка загрузки адресов';
            } finally {
              isLoading.value = false;
            }
          };

          const filteredStreets = computed(() => {
            if (!streetSearch.value) return streets.value;
            const term = streetSearch.value.toLowerCase();
            return streets.value.filter(s => s.name.toLowerCase().includes(term));
          });

          const filteredBuildings = computed(() => {
            if (!houseSearch.value) return buildings.value;          
            const term = houseSearch.value.toLowerCase();
            return buildings.value.filter(b => b.name.toLowerCase().includes(term));
          });

          const filteredAddresses = computed(() => {
            let list = filteredAddressList.value;
            if (showOnlyWithoutDate.value) {
              list = list.filter(a => {
                const v = a.verifyDate;
                return !v || String(v).trim() === '';
              });
            }
            if (selectedAddressText.value) {
              const term = selectedAddressText.value.toLowerCase();
              list = list.filter(a => (a.displayText || '').toLowerCase().includes(term));
            }
            list.sort((a, b) => {
              const timeA = a.lastIndDate ? new Date(a.lastIndDate).getTime() : 0;
              const timeB = b.lastIndDate ? new Date(b.lastIndDate).getTime() : 0;
              return timeA - timeB;
            });
            return list;
          });

          const loadControllers = async () => {
            try {
              const data = await apiRequest('/controllers', {});
              controllers.value = data;
            } catch (err) {
              console.error('Failed to load controllers:', err);
            }
          };

          const getOfflineAddresses = async (controllerId) => {
            if (typeof getControllerPackage !== 'function') return [];
            const pkg = await getControllerPackage(controllerId);
            if (!pkg || !Array.isArray(pkg.meters)) return [];
            const rows = [];
            pkg.meters.forEach(meter => {
              if (String(meter.CONTROLER_ID) !== String(controllerId)) return;          
              const abonent = pkg.abonents?.find(a => String(a.G_LICSCHET) === String(meter.LS));
              if (!abonent) return;            
              const client = pkg.clients?.find(c => c.ID === abonent.CLIENT_ID);
              const building = pkg.buildings?.find(b => b.ID === abonent.BUILDINGS_ID);
              if (!building) return;            
              const street = pkg.streets?.find(s => s.ID === building.STREET_ID);
              if (!street) return;
              const letterPart = abonent.LETTER ? ` ${abonent.LETTER}` : '';
              const appartsPart = abonent.APPARTS ? `кв. ${abonent.APPARTS}${letterPart}` : letterPart.trim();
              const namePart = client?.NAME || 'ФИО не указано';
              const phonePart = client?.PHONE ? `, тел: ${client.PHONE}` : '';
              const streetName = `${street.STREET_TYPE || ''} ${street.STREET || ''}`.trim();
              const corpsPart = building.CORPS ? ` ${building.CORPS}` : '';
              const houseName = `${building.HOUSE || ''}${corpsPart}`.trim();
              rows.push({
                meterId: meter.ID,
                controllerId: meter.CONTROLER_ID,
                verifyDate: meter.VERIFY_DATE,
                lastIndDate: meter.LAST_IND_DATE || null,
                buildingsId: building.ID,
                streetId: street.ID,
                streetName: streetName,
                houseName: houseName,
                displayText: `${appartsPart}, ${namePart}${phonePart}`
              });
            });
            return rows;
          };

          const updateOnlineStatus = () => {
            const wasOnline = isOnline.value;
            isOnline.value = navigator.onLine;
            if (wasOnline && !isOnline.value && showAllAddresses.value) {
              showAllAddresses.value = false;
              if (typeof showAlert === 'function') {
                showAlert('Потеряно подключение. Отображаются только ваши адреса', 'info');
              } else {
                alert('Потеряно подключение. Отображаются только ваши адреса');
              }
              loadData();
            }
          };

          const clearStreet = () => {
            streetSearch.value = '';
            closeStreet();
          };

          const clearHouse = () => {
            houseSearch.value = '';
            closeHouse();
          };

          const clearList = () => {
            selectedAddressText.value = '';
            selectedAddress.value = null;
            editData.value.meterId = null;
            editData.value.controllerId = null;
            editData.value.verifyDate = '';
            isListOpen.value = false;
            noReadingsMonths.value = 3;
          };

          const selectStreet = (street) => {
            streetSearch.value = street.name;
            selectedStreetId.value = street.id;
            isStreetOpen.value = false;          
            buildings.value = [];
            selectedBuildingId.value = null;
            houseSearch.value = '';
            filteredAddressList.value = [];
            selectedAddress.value = null;
            selectedAddressText.value = '';          
            const bldMap = new Map();
            allAddresses.value
              .filter(a => String(a.streetId) === String(selectedStreetId.value))
              .forEach(addr => {
                if (!bldMap.has(addr.buildingsId)) {
                  bldMap.set(addr.buildingsId, addr.houseName);
                }
              });
            buildings.value = Array.from(bldMap, ([id, name]) => ({ id, name }));
          };

          const closeStreet = () => {
            isStreetOpen.value = false;
            if (streetSearch.value) {
              const match = streets.value.find(s => s.name === streetSearch.value);
              if (!match) {
                selectedStreetId.value = null;
                buildings.value = [];
                selectedBuildingId.value = null;
                houseSearch.value = '';
                filteredAddressList.value = [];
                selectedAddress.value = null;
                selectedAddressText.value = '';
              }
            } else {
              selectedStreetId.value = null;
              buildings.value = [];
              selectedBuildingId.value = null;
              houseSearch.value = '';
              filteredAddressList.value = [];
              selectedAddress.value = null;
              selectedAddressText.value = '';
            }
          };

          const selectHouse = (bld) => {
            houseSearch.value = bld.name;
            selectedBuildingId.value = bld.id;
            isHouseOpen.value = false;          
            filteredAddressList.value = [];
            selectedAddress.value = null;
            selectedAddressText.value = '';          
            filteredAddressList.value = allAddresses.value.filter(
              a => String(a.buildingsId) === String(selectedBuildingId.value)
            );
          };

          const closeHouse = () => {
            isHouseOpen.value = false;
            if (houseSearch.value) {
              const match = buildings.value.find(b => b.name === houseSearch.value);
              if (!match) {
                selectedBuildingId.value = null;
                filteredAddressList.value = [];
                selectedAddress.value = null;
                selectedAddressText.value = '';
              }
            } else {
              selectedBuildingId.value = null;
              filteredAddressList.value = [];
              selectedAddress.value = null;
              selectedAddressText.value = '';
            }
          };

          const selectAddress = (addr) => {
            selectedAddressText.value = addr.displayText;
            selectedAddress.value = addr;
            editData.value.meterId = addr.meterId;
            editData.value.controllerId = (addr.controllerId !== undefined && addr.controllerId !== null) 
              ? addr.controllerId 
              : null;
            isListOpen.value = false;          
            let vDate = addr.verifyDate;
            if (vDate) {
              const str = String(vDate).trim();
              if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                editData.value.verifyDate = str;
              } else {
                const date = new Date(str);
                if (!isNaN(date.getTime())) {
                  const y = date.getFullYear();
                  const m = String(date.getMonth() + 1).padStart(2, '0');
                  const d = String(date.getDate()).padStart(2, '0');
                  editData.value.verifyDate = `${y}-${m}-${d}`;
                } else {
                  editData.value.verifyDate = '';
                }
              }
            } else {
              editData.value.verifyDate = '';
            }
          };

          const closeList = () => {
            isListOpen.value = false;
            if (selectedAddressText.value) {
              const match = filteredAddressList.value.find(a => a.displayText === selectedAddressText.value);
              if (!match) {
                selectedAddress.value = null;
              }
            } else {
              selectedAddress.value = null;
            }
          };

          const saveVerifyDate = async () => {
            if (!editData.value.meterId) return;
            saving.value = true;
            error.value = '';
            try {
              if (!navigator.onLine) {
                if (typeof savePendingVerifyUpdate !== 'function') {
                  throw new Error('Функция savePendingVerifyUpdate не найдена');
                }
                await savePendingVerifyUpdate({
                  meterId: editData.value.meterId,
                  verifyDate: editData.value.verifyDate,
                  controllerId: editData.value.controllerId
                });
                await updateLocalMeterCache(
                  editData.value.meterId,
                  editData.value.verifyDate,
                  editData.value.controllerId
                );
                if (typeof showAlert === 'function') {
                  showAlert(
                    'Нет подключения. Изменения сохранены локально.',
                    'info'
                  );
                }
              } else {
                await updateVerifyDate(editData.value.meterId, editData.value.verifyDate);
                await apiRequest('/update-meter-controller', {
                  meterId: editData.value.meterId,
                  controllerId: editData.value.controllerId
                });
                await updateLocalMeterCache(
                  editData.value.meterId,
                  editData.value.verifyDate,
                  editData.value.controllerId
                );
                if (typeof showAlert === 'function') {
                  showAlert('Дата обновлена', 'success');
                }
              }
              await loadData();
              selectedAddress.value = null;
              selectedAddressText.value = '';
              streetSearch.value = '';
              selectedStreetId.value = null;
              houseSearch.value = '';
              selectedBuildingId.value = null;
              buildings.value = [];
              filteredAddressList.value = [];
              isStreetOpen.value = false;
              isHouseOpen.value = false;
              isListOpen.value = false;
            } catch (err) {
              error.value = 'Ошибка сохранения: ' + (err.message || 'Неизвестная ошибка');
            } finally {
              saving.value = false;
            }
          };

          const checkSession = () => {
            const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
            if (!authData || !authData.token) {
              error.value = 'Сессия не найдена';
              showContinue.value = true;
              setTimeout(() => window.location.href = 'index.html', 2000);
              return false;
            }
            const now = Date.now();
            const EXPIRY_MS = 24000000;
            if (now - authData.authDate > EXPIRY_MS) {
              error.value = 'Истёк срок сессии';
              sessionStorage.setItem('lastAuthDate', authData.authDate);
              showContinue.value = true;
              return false;
            }
            showContinue.value = false;
            return true;
          };

          const cont = () => {
            sessionStorage.removeItem('authData');
            window.location.href = 'oldtokenwindow.html';
          };      

          const continueAction = () => {
            if (!checkType.value) {
              error.value = 'Выберите тип проверки';
              return;
            }
            sessionStorage.setItem('checkType', checkType.value);
            window.location.href = 'address.html';
          };

          const logout = () => {
            clearSessionAndLogout();
            window.location.href = 'index.html';
          };

          const viewhistory = () => {
            window.location.href = 'historywindow.html';
          };

          const handleOnline = async () => {
            updateOnlineStatus();
            if (typeof syncPendingVerifyUpdates === 'function') {
              try {
                await syncPendingVerifyUpdates();
              } catch (e) {
                console.warn('Ошибка синхронизации обновлений:', e);
              }
            }
            if (typeof syncPendingReadings === 'function') {
              try {
                await syncPendingReadings();
              } catch (e) {
                console.warn('Ошибка синхронизации показаний:', e);
              }
            }
            if (checkSession()) {
              await loadData();
            }
          };

          onMounted(() => {
            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', updateOnlineStatus);
            if (checkSession()) {
              loadData();
              loadControllers();
            }
          });

          onUnmounted(() => {
            window.removeEventListener('online', handleOnline);
            window.removeEventListener('offline', updateOnlineStatus);
          });

          return {
            showContinue, showOverlay, actNo, actDate, checkType,
            error, isLoading, saving,
            streets, buildings, filteredAddressList,
            streetSearch, houseSearch, selectedAddressText,
            selectedStreetId, selectedBuildingId,
            selectedAddress, editData, isOnline,
            clearStreet, clearHouse, clearList,
            isStreetOpen, isHouseOpen, isListOpen,
            filteredStreets, filteredBuildings, filteredAddresses, showOnlyWithoutDate,
            showNoReadings, noReadingsMonths, 
            selectStreet, selectHouse, selectAddress,
            closeStreet, closeHouse, closeList,
            saveVerifyDate, controllers, showAllAddresses,
            cont, continueAction, logout, viewhistory
          };
        }
      }).mount('#app');
    </script>

    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
