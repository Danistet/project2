 <!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выберите тип проверки</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Статус бойлера для приготовления ГВС</h1>
      <div class="form-container">
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" v-model="boilerStatus" value="present" />
            <span>В наличии</span>
          </label>
          <label class="radio-label">
            <input type="radio" v-model="boilerStatus" value="absent" />
            <span>Отсутствует</span>
          </label>
        </div>
        <button @click="continueAction" class="btn-primary">Продолжить</button>
        <button @click="logout" class="btn-secondary">Назад</button>
        <p v-if="error" class="error-message">{{ error }}</p>
      </div>
    </div>
  </body>
   <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const boilerStatus = ref('');
        const error = ref('');
        const continueAction = () => {
          error.value = '';
          if (!boilerStatus.value) {
            error.value = 'Выберите статус бойлера';
            return;
          }
          sessionStorage.setItem('boilerStatus', boilerStatus.value);
          window.location.href = 'main.html';
        };
        const logout = () => {
          window.location.href = 'checkownerwindow.html';
        };
        return {
          boilerStatus,
          error,
          continueAction,
          logout
        };
      }
    }).mount('#app');
  </script>
  <style>
      * { 
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #000000;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 24px 16px;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 24px;
        text-align: center;
      }

      .form-container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .radio-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border: 2px solid #45B0E1;
      }

      .radio-label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-size: 16px;
        padding: 8px;
        border-radius: 4px;
        transition: background-color 0.2s ease;
      }

      .radio-label:hover {
        background-color: #F0F9FC;
      }

      .radio-label input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: #45B0E1;
        cursor: pointer;
      }

      button {
        width: 100%;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 500;
        color: #FFFFFF;
        background-color: #45B0E1;
        border: 2px solid #45B0E1;
        border-radius: 0;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
        text-align: center;
      }

      button:hover {
        background-color: #2E8BC0;
        border-color: #2E8BC0;
      }

      button:active {
        background-color: #1A6B96;
        border-color: #1A6B96;
      }

      .error-message {
        color: #C62828;
        font-size: 14px;
        margin-top: 8px;
        word-break: break-word;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay-content {
        background: #FFFFFF;
        padding: 30px 40px;
        border-radius: 8px;
        text-align: center;
        max-width: 90%;
        min-width: 280px;
        border: 2px solid #45B0E1;
      }

      .overlay-content .act {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #000000;
      }

      .overlay-content .datetime {
        font-size: 16px;
        color: #333333;
        margin-bottom: 20px;
      }

      .overlay-content button {
        max-width: 200px;
        margin: 0 auto;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 12px;
        }
        h1 {
          font-size: 22px;
          margin-bottom: 20px;
        }
        button {
          padding: 12px 14px;
        }
      }
    </style>
</html>
