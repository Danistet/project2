<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля</title>
    <link rel="icon" href="data:,">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>

  <body>
    <div id="app">
      <h1>Сброс пароля</h1>     
      <div class="form-container">  
        <input 
          v-model="password" 
          type="password" 
          placeholder="Введите старый пароль"
          required 
          maxlength="15"
          class="form-input"
        />      
        <input 
          v-model="password" 
          type="password" 
          placeholder="Введите новый пароль"
          required 
          maxlength="15"
          class="form-input"
        />      
        <div class="button-group">
          <button @click="login('register')" class="btn-primary">Создать аккаунт</button>
          <button onclick="tologin()" class="btn-secondary">Обратно на страницу входа</button>
        </div>    
        <p v-if="response" class="response-message">{{ response }}</p>
        <p v-if="error" class="error-message">{{ error }}</p>
      </div>
    </div>
    <script src="./app.js"></script>
    <script>
      function tologin() 
      {
        window.location.href = 'index.html';
      }
    </script>
  </body>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
      color: #000000;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      color: #000000;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input::placeholder {
      color: #666666;
    }

    .form-input:focus {
      border-color: #2E8BC0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 500;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      text-align: center;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .response-message {
      color: #2E7D32;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    .error-message {
      color: #C62828;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      h1 {
        font-size: 22px;
        margin-bottom: 20px;
      }
      
      .form-input,
      button {
        padding: 12px 14px;
        font-size: 16px;
      }
    }

    .server-response {
      white-space: pre-line;
    }
  </style>
</html>
