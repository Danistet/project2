    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const meterNumElement = document.getElementById('meterNum');
        const phElement = document.getElementById('PH');
        let meterData = getActiveMeter ? getActiveMeter() : null;
        if (!meterData) {
          const stored = sessionStorage.getItem('meternum');
          if (stored) { try { meterData = JSON.parse(stored); } catch (e) {} }
        }      
        if (meterData?.meterNum) {
          meterNumElement.textContent = meterData.meterNum;
          if (typeof saveActiveMeter === 'function') saveActiveMeter(meterData);
        } else {
          meterNumElement.textContent = 'Не указан';
        }
      });      
      const fileInput = document.getElementById('fileInput');
      const cameraInput = document.getElementById('cameraInput');
      const previewContainer = document.getElementById('previewContainer');
      const clearFileBtn = document.getElementById('clearFileBtn');     
      const photoInputs = [
        { input: cameraInput, label: cameraInput.closest('.file-source-button') },
        { input: fileInput, label: fileInput.closest('.file-source-button') }
      ];
      const selectedFiles = () => photoInputs.flatMap(({ input }) => Array.from(input.files || []));
      const refreshPhotoPreview = () => {
        const files = selectedFiles();
        previewContainer.innerHTML = '';
        files.forEach(file => {
          if (!file.type.startsWith('image/')) return;
          const reader = new FileReader();
          reader.onload = event => {
            const img = document.createElement('img');
            img.src = event.target.result;
            img.classList.add('preview-image');
            previewContainer.appendChild(img);
          };
          reader.readAsDataURL(file);
        });
        photoInputs.forEach(({ input, label }) => {
          label.classList.toggle('file-selected', input.files.length > 0);
        });
        if (clearFileBtn) clearFileBtn.style.display = files.length > 0 ? 'block' : 'none';
      };
      const handlePhotoSelection = (changedInput) => {
        const files = selectedFiles();
        if (files.length > 5) {
          if (typeof showAlert === 'function') {
            showAlert('Можно загрузить не более 5 файлов.', 'error');
          } else {
            alert('Можно загрузить не более 5 файлов.');
          }
          changedInput.value = '';
          refreshPhotoPreview();
          return;
        }
        const MAX_SIZE = 100 * 1024 * 1024;
        for (const file of Array.from(changedInput.files || [])) {
          if (file.size > MAX_SIZE) {
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            if (typeof showAlert === 'function') {
              showAlert(`Файл "${file.name}" слишком большой (${sizeMB} МБ). Максимум: 100 МБ.`, 'error');
            } else {
              alert(`Файл "${file.name}" слишком большой (${sizeMB} МБ). Максимум: 100 МБ.`);
            }
            changedInput.value = '';
            refreshPhotoPreview();
            return;
          }
        }
        refreshPhotoPreview();
      };
      photoInputs.forEach(({ input }) => {
        input.addEventListener('change', () => handlePhotoSelection(input));
      });
      if (clearFileBtn) {
        clearFileBtn.addEventListener('click', function() {
          fileInput.value = '';
          cameraInput.value = '';
          refreshPhotoPreview();
          this.style.display = 'none';
        });
      }
      document.addEventListener('DOMContentLoaded', () => {
        const techCheck = document.getElementById('techcheck');
        const techcheckForm = document.getElementById('techcheckForm');
        if (techCheck && techcheckForm) {
          techCheck.addEventListener('change', function() {
            techcheckForm.style.display = this.checked ? 'block' : 'none';
            if (!this.checked) {
              document.getElementById('techcheck1').value = "";
              document.getElementById('techcheck2').value = "";
              window.resetCustomSelect('techcheck1');
              window.resetCustomSelect('techcheck2');
            }
          });
        }
      });
    </script>
    <script>
      const closeCustomSelect = (customSelect) => {
        if (!customSelect) return;
        customSelect.classList.remove('is-open');
        customSelect.querySelector('.custom-select-trigger')?.setAttribute('aria-expanded', 'false');
        const dropdown = customSelect.querySelector('.custom-select-dropdown');
        if (dropdown) dropdown.hidden = true;
      };

      window.resetCustomSelect = (inputId) => {
        const input = document.getElementById(inputId);
        const customSelect = input?.closest('[data-custom-select]');
        if (!customSelect) return;
        input.value = '';
        const valueLabel = customSelect.querySelector('.custom-select-value');
        if (valueLabel) valueLabel.textContent = customSelect.dataset.placeholder || 'Выберите вариант';
        customSelect.querySelector('.custom-select-trigger')?.classList.remove('has-value');
      };

      document.querySelectorAll('[data-custom-select]').forEach(customSelect => {
        const form = customSelect.closest('form');
        form?.addEventListener('reset', () => {
          setTimeout(() => window.resetCustomSelect(customSelect.querySelector('input[type="hidden"]').id), 0);
        });
      });

      document.addEventListener('click', event => {
        const option = event.target.closest('.custom-select-option');
        if (option) {
          const customSelect = option.closest('[data-custom-select]');
          const input = customSelect.querySelector('input[type="hidden"]');
          input.value = option.dataset.value;
          customSelect.querySelector('.custom-select-value').textContent = option.textContent.trim();
          customSelect.querySelector('.custom-select-trigger').classList.add('has-value');
          closeCustomSelect(customSelect);
          return;
        }

        const trigger = event.target.closest('.custom-select-trigger');
        const targetSelect = trigger?.closest('[data-custom-select]');
        document.querySelectorAll('[data-custom-select].is-open').forEach(customSelect => {
          if (customSelect !== targetSelect) closeCustomSelect(customSelect);
        });
        if (targetSelect) {
          const dropdown = targetSelect.querySelector('.custom-select-dropdown');
          const isOpening = dropdown.hidden;
          dropdown.hidden = !isOpening;
          targetSelect.classList.toggle('is-open', isOpening);
          trigger.setAttribute('aria-expanded', String(isOpening));
        }
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          document.querySelectorAll('[data-custom-select].is-open').forEach(closeCustomSelect);
        }
      });
    </script>
    <script>
      async function loadPreviousPHForViolation() {
        const phElement = document.getElementById('PH');
        if (!phElement) return;            
        let meterData = null;
        if (typeof getActiveMeter === 'function') meterData = getActiveMeter();
        if (!meterData && typeof getSelectedMeter === 'function') meterData = getSelectedMeter();
        if (!meterData) {
          const stored = sessionStorage.getItem('meternum');
          if (stored) { 
            try { meterData = JSON.parse(stored); } catch (e) {} 
          }
        }            
        const meter_id = meterData?.meterNum;
        if (!meter_id) {
          phElement.textContent = 'нет данных';
          return;
        }
        try {
          const response = await fetch(`${API_BASE}/PH/last?meter_id=${meter_id}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          const result = await response.json();            
          if (result.found && result.ph) {
            phElement.textContent = result.ph;
          } else {
            phElement.textContent = 'нет данных';
          }
        } catch (err) {
          console.error('Failed to load previous PH:', err);
          phElement.textContent = 'нет данных';
        }
      }
      window.addEventListener('DOMContentLoaded', () => {
        const meterNumElement = document.getElementById('meterNum');
        let meterData = typeof getActiveMeter === 'function' ? getActiveMeter() : null;
        if (!meterData) {
          const stored = sessionStorage.getItem('meternum');
          if (stored) { try { meterData = JSON.parse(stored); } catch (e) {} }
        }      
        if (meterData?.meterNum) {
          meterNumElement.textContent = meterData.meterNum;
          if (typeof saveActiveMeter === 'function') saveActiveMeter(meterData);
        } else {
          meterNumElement.textContent = 'Не указан';
        }
        loadPreviousPHForViolation();
      });
    </script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (typeof syncPendingReadings === 'function') {
          syncPendingReadings();
        }
      });
      window.addEventListener('online', () => {
      });
    </script>
    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
  </body>
