<!DOCTYPE html>
<html>
  <head>
    <meta charset="WIN1251">
    <title>Истёк срок сессии</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>

  <body>
    <h1>Срок сессии истёк</h1>
    <div id="app">
      <h2>Время последнего входа:</h2>
      <p id="authDatestr"></p>
      <h2>Выполните повторный вход</h2>
      <br>
      <button @click="logout">продолжить</button>
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const lastAuthDate = sessionStorage.getItem('lastAuthDate');
        const display = document.getElementById('authDatestr');
    
        if (lastAuthDate) {
          display.textContent = new Date(Number(lastAuthDate)).toLocaleString('ru-RU');
        } else {
           display.textContent = '---';
        }
      });
    </script>

    <script>
      const { createApp, ref } = Vue;
      createApp({
        setup() {    
          const logout = () => {
            sessionStorage.clear();
            window.location.href = 'index.html';
          };    
          return { logout };
        }
      }).mount('#app'); 
    </script>

  </body>

  <style>
    body 
    {
      margin: 0;
      color: goldenrod;
      background-color: rgb(56, 54, 54);
      font-size: 32px;
      justify-content: center;
      justify-items: center;
    }
    button 
    {
      background-color: aqua;
      width: 177px;
      justify-content: center;
      justify-items: center;
    }
    h2 
    {
      color: blueviolet;
       font-size: 24px;
    }
    p 
    {
      font-size: 24px;
      word-break: break-all;
    }
    input
    {
      background-color: aquamarine;
      color: rgb(0, 0, 0);
    }
  </style>
</html>
