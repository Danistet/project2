<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сессия истекла</title>
    <link rel="icon" href="data:,">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>

  <body>
    <div id="app" class="page-wrapper">
      <header class="page-header">
        <h1>Срок сессии истёк</h1>
      </header>
      <main class="content-card">
        <div class="info-block">
          <p class="info-label">Время последнего входа:</p>
          <p id="authDatestr" class="info-value">---</p>
        </div>
        <p class="action-hint">Выполните повторный вход</p>
        <div class="button-group">
          <button @click="logout" class="btn-primary">Продолжить</button>
        </div>
      </main>
      <div class="status" id="statusDiv"></div> 
    </div>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const lastAuthDate = sessionStorage.getItem('lastAuthDate');
        const display = document.getElementById('authDatestr');    
        if (lastAuthDate) {
          display.textContent = new Date(Number(lastAuthDate)).toLocaleString('ru-RU');
        } else {
           display.textContent = '---';
        }
      });
    </script>

    <script>
      const { createApp, ref } = Vue;
      createApp({
        setup() {    
          const logout = () => {
            sessionStorage.clear();
            window.location.href = 'index.html';
          };    
          return { logout };
        }
      }).mount('#app'); 
    </script>
    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
  </body>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      width: 100%;
      padding: 24px 16px;
    }

    .page-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #000000;
    }

    .content-card {
      width: 100%;
      max-width: 480px;
      border: 2px solid #45B0E1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: #FFFFFF;
    }

    .info-block {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .info-label {
      font-size: 17px;
      font-weight: 500;
      color: #333333;
    }

    .info-value {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      word-break: break-word;
      text-align: center;
    }

    .action-hint {
      font-size: 17px;
      font-weight: 500;
      color: #333333;
      text-align: center;
      margin: 4px 0;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      max-width: 320px;
      min-height: 56px;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      text-align: center;
      touch-action: manipulation;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }
      
      .page-header h1 {
        font-size: 24px;
      }
      
      .content-card {
        padding: 24px 20px;
        gap: 20px;
      }
      
      .info-value {
        font-size: 19px;
      }
      
      .action-hint {
        font-size: 16px;
      }
      
      button {
        min-height: 52px;
        font-size: 17px;
        max-width: 100%;
      }

      .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
      
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    }
  </style>
</html>
