<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>владелец лицевого счета присутствует?</title>
    <link rel="icon" href="data:,">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./api.js"></script>
  </head>
    <body>
      <div id="app">
        <div class="form-container">
          <h1>владелец лицевого счета присутствует?</h1>
          <div class="form-container"> 
            <div class="button-group">
              <button @click="cont" id="ContinueButton" class="btn-secondary ContinueButton" v-if="showContinue">Продолжить</button>
              <button type="button" v-if="!showContinue" onclick="wihtowner()">да</button>
              <button type="button" v-if="!showContinue" onclick="noowner()">нет</button>
              <button type="button" v-if="!showContinue" onclick="tologin()" class="btn-secondary">Назад</button>
            </div>
          </div>
          <div class="status" id="statusDiv"></div> 
        </div>  
      </div>    
    </body>

    <script src="./app.js"></script>
    <script>
      function tologin() {
        sessionStorage.clear();
        window.location.href = 'ActWindow.html';
      }
      function wihtowner() {
        window.location.href = 'OwnerWindow.html';
      }
      function noowner() {
        window.location.href = 'Representativewindow.html';
      }
    </script>
    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>

    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
      color: #000000;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      color: #000000;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input::placeholder {
      color: #666666;
    }

    .form-input:focus {
      border-color: #2E8BC0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      width: 250px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 500;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      text-align: center;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .response-message {
      color: #2E7D32;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    .error-message {
      color: #C62828;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
      
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      h1 {
        font-size: 22px;
        margin-bottom: 20px;
      }
      
      .form-input,
      button {
        padding: 12px 14px;
        font-size: 16px;
      }
    }

    .server-response {
      white-space: pre-line;
    }
  </style>

  </html>
