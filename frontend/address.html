<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Введите адрес</title>
    <link rel="icon" href="data:,">
    <script src="./api.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app" class="page-wrapper">
      <header class="page-header">
        <h1>Введите адрес</h1>
        <p v-if="response" class="response-message">{{ response }}</p>
        <p v-if="error" class="error-message">{{ error }}</p>
      </header>      
      <main class="content-card" style="position: relative;">                
        <div v-if="isLoading" class="loading-overlay">
          <div class="spinner"></div>
          <p>Загрузка данных...</p>
        </div> 
        <div v-if="showOverlay" class="overlay" @click.self="continueFromOverlay">
          <div class="overlay-content">
            <h2 class="act">Акт № {{ actNo }}</h2>
            <p class="datetime">{{ actDate }}</p>
            <button @click="continueFromOverlay" class="btn-primary">Продолжить</button>
          </div>
        </div>       
        <form 
          @submit.prevent="saveAddressAndContinue" 
          novalidate
          :disabled="showContinue"
          :style="{ opacity: isLoading ? 0.5 : 1, pointerEvents: isLoading ? 'none' : 'auto', transition: 'opacity 0.2s ease' }"
        >
          <div class="form-group">
            <label for="townInput" class="form-label">Город</label>
            <input 
              type="search" id="townInput" list="resultsTown"               
              placeholder="Введите город" 
              autocomplete="off"              
              @input="onTownInput" @change="onTownChange" 
              v-model="townSearch" class="form-input" required
            >
            <datalist id="resultsTown">
              <option v-for="town in towns" :key="town.id" :value="town.name" :data-id="town.id"></option>
            </datalist>
          </div>          
          <div class="form-group">
            <label for="streetInput" class="form-label">Улица</label>
            <input 
              type="search" id="streetInput" list="resultsStreet" 
              placeholder="Введите улицу" 
              autocomplete="off"
              @input="onStreetInput" @change="onStreetChange" 
              :disabled="!selectedTownId" v-model="streetSearch" class="form-input" :required="!!selectedTownId"
            >
            <datalist id="resultsStreet">
              <option v-for="street in streets" :key="street.id" :value="street.name" :data-id="street.id"></option>
            </datalist>
          </div>          
          <div class="form-group">
            <label for="houseInput" class="form-label">Дом</label>
            <input 
              type="search" id="houseInput" list="resultsHome" 
              placeholder="Введите номер дома" 
              autocomplete="off"
              @input="onHouseInput" @change="onHouseChange" 
              :disabled="!selectedStreetId" v-model="houseSearch" class="form-input" :required="!!selectedStreetId"
            >
            <datalist id="resultsHome">
              <option v-for="bld in buildings" :key="bld.id" :value="bld.house" :data-id="bld.id"></option>
            </datalist>
          </div>          
          <div class="form-group">
            <label class="form-label checkbox-label">
              <input type="checkbox" id="appartscheck" v-model="showApparts" class="form-checkbox">
              <span class="checkbox-text">Квартира</span>
            </label>
            <input 
              :style="{ 
                visibility: showApparts ? 'visible' : 'hidden', 
                position: showApparts ? 'static' : 'absolute',
                opacity: showApparts ? '1' : '0',
                pointerEvents: showApparts ? 'auto' : 'none',
                height: showApparts ? 'auto' : '0',
                overflow: 'hidden'
              }" 
              type="search" id="appartsInput" list="resultsApparts" 
              placeholder="Введите номер квартиры" :required="showApparts" 
              autocomplete="off"
              @input="onAppartsInput" @change="onAppartsChange" 
              v-model="appartsSearch" class="form-input" tabindex="-1"
            >
            <datalist id="resultsApparts">
              <option v-for="appr in apparts" 
                :key="appr.id" 
                :value="appr.displayHouse"
                :data-id="appr.id" 
                :data-licschet="appr.g_licschet">
              </option>
            </datalist>
          </div>          
          <div class="button-group">
            <button @click="cont" id="ContinueButton" class="btn-primary ContinueButton" v-if="showContinue">Продолжить</button>
            <button type="submit" class="btn-primary" v-if="!showContinue">Подтвердить</button>
            <button type="button" onclick="tologin()" class="btn-secondary" v-if="!showContinue">Назад</button>
          </div>
        </form>
        <div class="status" id="statusDiv"></div> 
      </main>
    </div>
    <script src="./app.js"></script>
    <script>
      function tologin() {
        sessionStorage.clear();
        window.location.href = 'index.html';
      }      
    </script>
    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
  </body>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 18px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      width: 100%;
      padding: 20px 16px;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-content {
      background: #FFFFFF;
      padding: 30px 40px;
      border-radius: 8px;
      text-align: center;
      max-width: 90%;
      min-width: 280px;
      border: 2px solid #45B0E1;
    }
    .overlay-content .act {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #000000;
    }
    .overlay-content .datetime {
      font-size: 16px;
      color: #333333;
      margin-bottom: 20px;
    }
    .overlay-content button {
      max-width: 200px;
      margin: 0 auto;
    }

    .page-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #000000;
    }

    .content-card {
      width: 100%;
      max-width: 480px;
      border: 2px solid #45B0E1;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #FFFFFF;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .form-label {
      font-size: 17px;
      font-weight: 500;
      color: #333333;
    }

    .form-input {
      width: 100%;
      min-height: 56px;
      padding: 16px 20px;
      font-size: 18px;
      color: #000000;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-input::placeholder {
      color: #999999;
    }

    .form-input:focus {
      border-color: #2E8BC0;
      background-color: #F8FDFF;
    }

    .form-input:disabled {
      background-color: #F5F5F5;
      border-color: #CCCCCC;
      color: #999999;
      cursor: not-allowed;
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      display: flex;
    }

    .form-checkbox {
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      accent-color: #45B0E1;
      cursor: pointer;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .checkbox-text {
      font-size: 17px;
      font-weight: 500;
      color: #333333;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      max-width: 320px;
      min-height: 56px;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      text-align: center;
      touch-action: manipulation;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .btn-secondary:active {
      background-color: #E0F4FA;
    }

    datalist {
      font-size: 16px;
    }

    .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
      
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    .loading-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.85);
        z-index: 10;
        border-radius: 8px;
        color: #45B0E1;
        font-weight: 600;
        font-size: 18px;
      }
      .spinner {
        width: 48px; height: 48px;
        border: 5px solid #E0F4FA;
        border-top: 5px solid #45B0E1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      .page-header h1 {
        font-size: 24px;
      }
      
      .content-card {
        padding: 20px 16px;
        gap: 18px;
      }
      
      .form-input {
        min-height: 52px;
        font-size: 17px;
        padding: 14px 18px;
      }
      
      .form-checkbox {
        width: 22px;
        height: 22px;
        min-width: 22px;
        min-height: 22px;
      }
      
      .checkbox-text {
        font-size: 16px;
      }
      
      button {
        min-height: 52px;
        font-size: 17px;
        max-width: 100%;
      }
    }

    .server-response {
      white-space: pre-line;
    }
  </style>
</html>
