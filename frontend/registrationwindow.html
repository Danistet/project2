<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Регистрация</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script src="./api.js"></script>
    </head>
    
    <body>
        <h1>Регистрация</h1>
        <div id="app" class="server-response">
            <div>
                <label>Город:</label>
                <input type="search" id="townInput" list="resultsTown" placeholder="Введите город..." 
                    @input="onTownInput" @change="onTownChange">
                <datalist id="resultsTown">
                <option v-for="town in towns" :key="town.id" :value="town.name" :data-id="town.id"></option>
                </datalist><br>
                <label>Улица:</label>
                <input type="search" id="streetInput" list="resultsStreet" placeholder="Введите улицу..." 
                    @input="onStreetInput" @change="onStreetChange" :disabled="!selectedTownId">
                <datalist id="resultsStreet">
                <option v-for="street in streets" :key="street.id" :value="street.name" :data-id="street.id"></option>
                </datalist><br>
                <label>Дом:</label>
                <input type="search" id="houseInput" list="resultsHome" placeholder="Введите номер дома..." 
                    @input="onHouseInput" @change="onHouseChange" :disabled="!selectedStreetId">
                <datalist id="resultsHome">
                <option v-for="bld in buildings" :key="bld.id" :value="bld.house" :data-id="bld.id"></option>
                </datalist><br>
                <!-- загрузка option из бд -->
            </div>
            <input v-model="username" placeholder="Придумайте логин" required type="text" maxlength="10"><br>
            <input v-model="password" type="password" placeholder="Придумайте пароль" required maxlength="15"/><br>
            <br>
            <button @click="login('register')">Создать аккаунт</button><br>
            <button onclick="tologin()">Обратно на страницу входа</button>
            <p v-if="response">{{ response }}</p>
            <p v-if="error" style="color: red;">{{ error }}</p>
        </div>
        <script src="./app.js"></script>
        <script>
            function tologin()
            {
                window.location.href = 'index.html';
            }
        </script>
    </body>

    <style>
        body 
        {
            margin: 0;
            color: goldenrod;
            background-color: rgb(56, 54, 54);
            font-size: 24px;
            justify-content: center;
            justify-items: center;
        }
        button 
        {
            background-color: aqua;
            width: 177px;
        }  
        p
        {
            font-size: 14px;
            color: greenyellow;
            word-break: break-all;
        }
        input
        {
            background-color: aquamarine;
            color: rgb(0, 0, 0);
        } 
    </style>
</html>
