<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список нарушений</title>
    <link rel="icon" href="data:,">
    <script src="./api.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

    <body>
        <header class="page-header">
            <h1>Список нарушений</h1>
            <div id="error" class="error-message"></div>
        </header>
        <section>
            <div class="button-group">
                <button class="btn-primary">Передать</button>
                <button onclick="meterwindow()" class="btn-secondary">Назад</button>
              </div>
        </section>
    </body>

    <script>

        function meterwindow() {
            window.location.href = 'metervaluewindow.html';
        }
    </script>

    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        }

        body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        font-size: 18px;
        line-height: 1.5;
        color: #000000;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        width: 100%;
        padding: 20px 16px;
        }

        .page-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        }

        .page-header {
        width: 100%;
        max-width: 480px;
        text-align: center;
        margin-bottom: 20px;
        }

        .page-header h1 {
        font-size: 26px;
        font-weight: 700;
        color: #000000;
        }

        .content-card {
        width: 100%;
        max-width: 480px;
        border: 2px solid #45B0E1;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #FFFFFF;
        }

        form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
        }

        .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
        }

        .form-label {
        font-size: 17px;
        font-weight: 500;
        color: #333333;
        }

        .form-input {
        width: 100%;
        min-height: 56px;
        padding: 16px 20px;
        font-size: 18px;
        color: #000000;
        background-color: #FFFFFF;
        border: 2px solid #45B0E1;
        border-radius: 0;
        outline: none;
        transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .form-input::placeholder {
        color: #999999;
        }

        .form-input:focus {
        border-color: #2E8BC0;
        background-color: #F8FDFF;
        }

        .form-input:disabled {
        background-color: #F5F5F5;
        border-color: #CCCCCC;
        color: #999999;
        cursor: not-allowed;
        }

        .checkbox-label {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        display: flex;
        }

        .form-checkbox {
        width: 24px;
        height: 24px;
        min-width: 24px;
        min-height: 24px;
        accent-color: #45B0E1;
        cursor: pointer;
        touch-action: manipulation;
        flex-shrink: 0;
        }

        .checkbox-text {
        font-size: 17px;
        font-weight: 500;
        color: #333333;
        }

        .button-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 8px;
        }

        button {
        width: 100%;
        max-width: 320px;
        min-height: 56px;
        padding: 16px 24px;
        font-size: 18px;
        font-weight: 600;
        color: #FFFFFF;
        background-color: #45B0E1;
        border: 2px solid #45B0E1;
        border-radius: 0;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
        text-align: center;
        touch-action: manipulation;
        }

        button:hover {
        background-color: #2E8BC0;
        border-color: #2E8BC0;
        }

        button:active {
        background-color: #1A6B96;
        border-color: #1A6B96;
        transform: scale(0.98);
        }

        .btn-secondary {
        background-color: #FFFFFF;
        color: #45B0E1;
        border: 2px solid #45B0E1;
        }

        .btn-secondary:hover {
        background-color: #F0F9FC;
        }

        .btn-secondary:active {
        background-color: #E0F4FA;
        }

        datalist {
        font-size: 16px;
        }

        @media (max-width: 480px) {
        body {
            padding: 16px 12px;
        }
        
        .page-header h1 {
            font-size: 24px;
        }
        
        .content-card {
            padding: 20px 16px;
            gap: 18px;
        }
        
        .form-input {
            min-height: 52px;
            font-size: 17px;
            padding: 14px 18px;
        }
        
        .form-checkbox {
            width: 22px;
            height: 22px;
            min-width: 22px;
            min-height: 22px;
        }
        
        .checkbox-text {
            font-size: 16px;
        }
        
        button {
            min-height: 52px;
            font-size: 17px;
            max-width: 100%;
        }
        }

        .server-response {
        white-space: pre-line;
        }
    </style>

  </html>
