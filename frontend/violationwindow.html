<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список нарушений</title>
    <link rel="icon" href="data:,">
    <script src="./api.js"></script>
    <script src="./vendor/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="page-header">
        <h1>Проверка наличия нарушений</h1>            
        <div id="error" class="error-message"></div>
      </header>
      <div class="form-container"> 
        <section>
          <div class="button-group">
            <button id="ContinueButton" class="btn-secondary ContinueButton" style="display:none;" onclick="handleExpiredSessionContinue()">Продолжить</button>
            <button onclick="mainwindow()" class="btn-primary">Передать показания</button>
            <button onclick="violationwindow()" class="btn-primary">Список нарушений</button>
            <button onclick="exit()" class="btn-secondary">Назад</button>
          </div>
        </section>
        <div class="status" id="statusDiv"></div>
      </div>  
    </div>  
  </body>

  <script>
    function mainwindow() 
    {
      window.location.href = 'main.html';
    }
    function violationwindow() 
    {
      window.location.href = 'violationform.html';
    }
    function exit()
    {
      window.location.href = 'address.html';
    }
    function handleExpiredSessionContinue() {
      sessionStorage.removeItem('authData');
      window.location.href = 'oldtokenwindow.html';
    }
  </script>
  <script>
    let statusTimeout;    
    let isInitialLoad = true;
    function updateStatus(isOnline) {
      var statusDiv = document.getElementById("statusDiv");
      if (!statusDiv) return;
      clearTimeout(statusTimeout);
      if (isOnline) {
        if (!isInitialLoad) {
          statusDiv.style.backgroundColor = "#44ff00";
          statusDiv.textContent = "Подключено";
          statusDiv.classList.remove("status-hidden");        
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
      } else {
        statusDiv.style.backgroundColor = "#ff0007";
        statusDiv.textContent = "Нет подключения";
        statusDiv.classList.remove("status-hidden");
        statusTimeout = setTimeout(function() {
          statusDiv.classList.add("status-hidden");
        }, 5000);
      }
      isInitialLoad = false;
    }   
    updateStatus(navigator.onLine);
    window.addEventListener("online", () => updateStatus(true));
    window.addEventListener("offline", () => updateStatus(false));
  </script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const authData = sessionStorage.getItem('authData') ? JSON.parse(sessionStorage.getItem('authData')) : null;
      const errorEl = document.getElementById('error');
      if (!authData) {
        if (errorEl) errorEl.textContent = 'Сессия не найдена';
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
      }
      const now = Date.now();
      if (now - authData.authDate > 24000000) {
        if (errorEl) errorEl.textContent = 'Истёк срок сессии';
        sessionStorage.setItem('lastAuthDate', authData.authDate);          
        let btn = document.getElementById('ContinueButton');
        if (!btn) {
          btn = document.createElement('button');
          btn.id = 'ContinueButton';
          btn.className = 'btn-secondary ContinueButton';
          btn.textContent = 'Продолжить';
          btn.style.marginTop = '10px';
          btn.onclick = () => {
            sessionStorage.removeItem('authData');
            window.location.href = 'oldtokenwindow.html';
          };
          const container = document.querySelector('.form-container');
          if (container) container.insertBefore(btn, container.firstChild);
        } else {
          btn.style.display = 'inline-block';
        }
        document.querySelectorAll('button').forEach(b => {
          if (b.id !== 'ContinueButton') b.style.display = 'none';
        });
      }
    });
  </script>
  <style>
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 500;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      text-align: center;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .btn-secondary:active {
      background-color: #E0F4FA;
    }

    .error-message {
      color: #C62828;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-content {
      background: #FFFFFF;
      padding: 30px 40px;
      border-radius: 8px;
      text-align: center;
      max-width: 90%;
      min-width: 280px;
      border: 2px solid #45B0E1;
    }

    .overlay-content .act {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #000000;
    }

    .overlay-content .datetime {
      font-size: 16px;
      color: #333333;
      margin-bottom: 20px;
    }

    .overlay-content button {
      max-width: 200px;
      margin: 0 auto;
    }

    .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
        
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 20px;
      }
      button {
        padding: 12px 14px;
      }
    }
  </style>
</html>
