<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="WIN1251">
        <title>информация</title>
        <script src="./api.js"></script>
    </head>
    <body>
        <div class="container">
            <h1>Передать показания</h1>
            <div id="error"></div>
        </div>
        <div>
            <p>Серийный номер:</p>
            <p id="meterNum"></p>
            <p>Предыдущие показания:</p>
            <p id="metervalue"></p>
            <br>
            <p>Текущее показание:</p>
        </div>
        <div>
            <input v-model="newmetervalue"><br>
            <button>Передать</button><br>
            <button onclick="main()">Выход</button>
        </div>

        <script>
            window.addEventListener('DOMContentLoaded', async () => {
                const authData = JSON.parse(sessionStorage.getItem('authData'));
                const phoneElement = document.getElementById('phone');
                const errorContainer = document.getElementById('error');
                //////////////////////////////////////
                const meterValue = document.getElementById('metervalue');
                console.log("brbrrb",meterValue);
                if (!authData) {
                    showError('Сессия не найдена');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }
            
                console.log('Auth data from sessionStorage:', authData);            
                if (!authData.phone || !authData.token) {
                    showError('Некорректные данные сессии');
                    clearSession();
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }
            
                try {
                    console.log('Обновление:', authData.phone);               
                    const result = await apiRequest('/update-token', {
                        phone: authData.phone,
                        token: authData.token
                    });
                
                    console.log(result);           
                    sessionStorage.setItem('authData', JSON.stringify(result));               
                } catch (error) {
                    console.error('Ошибка обновления:', error);
                    showError(`Ошибка обновлени: ${error.message}`);
                }                    
            });

            function main() {                
                const now = Date.now();                 
                window.location.href = 'main.html';
            }

            function showError(message) {
                const errorContainer = document.getElementById('error');
                errorContainer.innerHTML = `<div style="color: red;">${message}</div>`;
            }
        </script>
    </body>
    <style>
        body 
        {
            margin: 0;
            color: goldenrod;
            background-color: rgb(56, 54, 54);
            font-size: 24px;
            justify-content: center;
            justify-items: center;
        }
        button 
        {
            background-color: aqua;
            width: 177px;
        }
        div 
        {
            justify-content: center;
            justify-items: center;
        }
        p 
        {
            color: blueviolet;
            justify-content: center;
            justify-items: center;
            word-break: break-all;
            white-space: nowrap;
        }
        input
        {
            background-color: aquamarine;
            color: rgb(0, 0, 0);
            justify-content: center;
            justify-items: center;
        }
    </style>
</html>
