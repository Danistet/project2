<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передать показания</title>
    <script src="./api.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="page-header">
        <h1>Передать показания</h1>
        <div id="error" class="error-message"></div>
      </header>
      <main class="content-wrapper">
        <section class="info-card">
          <div class="info-row">
            <span class="info-label">Серийный номер:</span>
            <span id="meterNum" class="info-value"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Предыдущее показание:</span>
            <span id="PH" class="info-value">нет данных</span>
          </div>
        </section>  
        <section class="form-section">
          <label for="newPH" class="form-label">Текущее показание:</label>
          <input 
            maxlength="15" 
            required 
            type="text" 
            id="newPH" 
            v-model="PH" 
            inputmode="decimal" 
            placeholder="0,000"
            class="form-input"
          > 
          <label class="form-label checkbox-label">            
            <input type="checkbox" id="appartscheck" class="form-checkbox">
            <span class="checkbox-text">Список нарушений</span>
          </label>     
        </section>  

        <form novalidate id="violationsForm" style="display: none;">
          <div class="form-group">
            <label class="form-label">Механические повреждения</label>
            <select class="form-input" id="violation1">
              <option value="" disabled selected>Выберите нарушение</option>
              <option value="не плотное прилегание стекла индикатора">не плотное прилегание стекла индикатора</option>
              <option value="не предусмотренные изготовителем отверстия или трещины">не предусмотренные изготовителем отверстия или трещины</option>
              <option value="нарушения контрольных пломб">нарушения контрольных пломб</option>
            </select>            
          </div>
          <div class="form-group">
            <label class="form-label">2</label>
            <select class="form-input" id="violation2">
              <option value="" disabled selected>Выберите нарушение</option>
              <option value="не отображение приборами учета результатов измерений">не отображение приборами учета результатов измерений</option>
              <option value="">не указано</option>
            </select>            
          </div>
          <div class="form-group">
            <label class="form-label">3</label>
            <select class="form-input" id="violation3">
              <option value="" disabled selected>Выберите нарушение</option>
              <option value="истечение межповерочного интервала поверки">истечение межповерочного интервала поверки</option>
              <option value="">не указано</option>
            </select>            
          </div>
          <div class="button-group">
            <label class="form-label">Прикрепить фото нарушения</label>
            <input type="file" name="fileInput" id="fileInput" accept="image/png" multiple>
            <div id="previewContainer"></div>
            <button type="button" class="btn-primary" onclick="console.log('Подтвердить нарушения')">Подтвердить</button>                        
          </div>          
        </form>

        <label class="form-label checkbox-label">            
          <input type="checkbox" id="techcheck" class="form-checkbox">
          <span class="checkbox-text">технические некоректности</span>
        </label>  
        <form novalidate id="techcheckForm" style="display: none;">
          <div class="form-group">
            <label class="form-label">ошибочная дата проверки</label>
            <select class="form-input" id="techcheck1">
              <option value="" disabled selected>Выберите вариант</option>
              <option value="variant 1">variant 1</option>
              <option value="variant 2">variant 2</option>
              <option value="variant 3">variant 3</option>
            </select>            
          </div>
          <div class="form-group">
            <label class="form-label">Серийный номер счетчика</label>
            <select class="form-input" id="techcheck2">
              <option value="" disabled selected>Выберите вариант</option>
              <option value="1">1</option>
              <option value="">не указано</option>
            </select>            
          </div>
          <div class="form-group">
            <label class="form-label">333333</label>
            <select class="form-input" id="techcheck3">
              <option value="" disabled selected>Выберите вариант</option>
              <option value="1">1</option>
              <option value="">не указано</option>
            </select>            
          </div>
        </form>
        <div class="button-group">          
          <button @click="NewPH" class="btn-primary">Передать</button>                             
          <button onclick="main()" class="btn-secondary">Назад</button>
        </div>
      </main>
    </div>

    <script src="./app.js"></script>
    <script>
      const fileInput = document.getElementById('fileInput');
      const previewContainer = document.getElementById('previewContainer');

      fileInput.addEventListener('change', function() {
        // Очищаем контейнер от старых превью при новом выборе
        previewContainer.innerHTML = ''; 

        // Превращаем List файлов в массив и перебираем
        Array.from(this.files).forEach(file => {
          // Проверяем, что это точно картинка
          if (!file.type.startsWith('image/')) return; 

          const reader = new FileReader();

          // Когда файл прочитан, создаем элемент img
          reader.onload = function(event) {
            const img = document.createElement('img');
            img.src = event.target.result;
            img.classList.add('preview-image');
            
            // Добавляем картинку на экран
            previewContainer.appendChild(img);
          };

          // Читаем файл как Base64 строку
          reader.readAsDataURL(file); 
        });
      });
    </script>
    <script>
      function formatWithThousands(value) {
        if (!value && value !== 0) return '';
        const str = String(value).trim();
        if (!str) return '';
        if (/[,\.]\d+/.test(str)) {
          return str.replace('.', ',');
        }
        if (/^\d+$/.test(str)) {
          return `${str},000`;
        }
        return str.replace('.', ',');
      }

      document.addEventListener('DOMContentLoaded', () => {        
        const inputPH = document.getElementById('newPH');
        if (inputPH) {
          inputPH.addEventListener('blur', (e) => {
            e.target.value = formatWithThousands(e.target.value);
          });
          inputPH.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9,\.]/g, '');
          });
        }        
        const appartsCheck = document.getElementById('appartscheck');
        const violationsForm = document.getElementById('violationsForm');        
        if (appartsCheck && violationsForm) {
          appartsCheck.addEventListener('change', function() {
            if (this.checked) {
              violationsForm.style.display = 'block';
            } else {
              violationsForm.style.display = 'none';              
              document.getElementById('violation1').value = "";
              document.getElementById('violation2').value = "";
              document.getElementById('violation3').value = "";
            }
          });
        }
        const techCheck = document.getElementById('techcheck');
        const techcheckForm = document.getElementById('techcheckForm');
        if (techCheck && techcheckForm) {
          techCheck.addEventListener('change', function() {
            if (this.checked) {
              techcheckForm.style.display = 'block';
            } else {
              techcheckForm.style.display = 'none';
              document.getElementById('techcheck1').value = "";
              document.getElementById('techcheck2').value = "";
              document.getElementById('techcheck3').value = "";
            }
          });
        }
      });
    </script>

    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const authData = JSON.parse(sessionStorage.getItem('authData'));
        const errorContainer = document.getElementById('error');
        if (!authData) {
          showError('Сессия не найдена');
          setTimeout(() => { window.location.href = 'index.html'; }, 2000);
          return;
        }
        if (!authData.token) {
          showError('Некорректные данные сессии');
          clearSession();
          window.location.href = 'index.html';
          return;
        }  
        loadMeterData();                            
      });
      async function loadMeterData() {
        const meterNumElement = document.getElementById('meterNum');
        const errorElement = document.getElementById('error');
        errorElement.style.color = 'red';
        let meterData = getActiveMeter();
        if (!meterData) {
          meterData = getSelectedMeter();
        }
        if (!meterData) {
          const storedMeterData = sessionStorage.getItem('meternum');
          if (storedMeterData) {
            try {
              meterData = JSON.parse(storedMeterData);
            } catch (e) {
              console.error("Ошибка данных счетчика:", e);
              errorElement.textContent = 'Ошибка формата данных счетчика';
              window.location.href = 'index.html';
            }
          }
        }      
        if (meterData?.meterNum) {
          meterNumElement.textContent = meterData.meterNum;
          if (typeof saveActiveMeter === 'function') {
            saveActiveMeter(meterData);
          }
        } else {
          meterNumElement.textContent = 'Не указан';
          console.log("Данные счетчика не найдены");
          window.location.href = 'index.html';
        }
      }    
      function main() {                
        window.location.href = 'main.html';
      }
      function violation() {
        window.location.href = 'violationwindow.html';
      }
      function showError(message) {
        const errorContainer = document.getElementById('error');
        errorContainer.innerHTML = `<div style="color: red;">${message}</div>`;
      }
    </script>

    <script>
      async function loadPreviousPHFromAPI() {
        const phElement = document.getElementById('PH');
        if (!phElement) return;          
        let meterData = getActiveMeter();
        if (!meterData) {
          meterData = getSelectedMeter();
        }
        if (!meterData) {
          const storedMeterData = sessionStorage.getItem('meternum');
          if (storedMeterData) {
            try {
              meterData = JSON.parse(storedMeterData);
            } catch (e) {
              console.error("Ошибка данных счетчика:", e);
              window.location.href = 'index.html';
            }
          }
        }      
        const meter_id = meterData?.meterNum;
        if (!meter_id) {
          phElement.textContent = 'нет данных';
          return;
        }       
        try {
          const response = await fetch(`http://localhost:3000/PH/last?meter_id=${meter_id}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });       
          const result = await response.json();       
          if (result.found && result.ph) {
            phElement.textContent = result.ph;
            sessionStorage.setItem('ph', JSON.stringify({ PH: result.ph }));
          } else {
            phElement.textContent = 'нет данных';
          }
        } catch (err) {
          console.error('Failed to load previous PH:', err);
          phElement.textContent = 'нет данных';
          window.location.href = 'index.html';
        }
      }   
      window.addEventListener('DOMContentLoaded', () => {
        loadMeterData();
        loadPreviousPHFromAPI(); 
      });
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('fileInput');    
        if (fileInput) {
          fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {          
              this.classList.add('file-selected');          
              console.log('Выбран файл:', this.files[0].name);
            } else {          
              this.classList.remove('file-selected');
            }
          });
        }
      });
    </script>
  </body>
