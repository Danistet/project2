<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="WIN1251">
        <title>информация</title>
        <script src="./api.js"></script>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <div class="container">
                <h1>Передать показания</h1>
                <div id="error"></div>
            </div>
            <div>
                <p>Серийный номер:</p>
                <p id="meterNum"></p>
                <p>Предыдущее показание:</p>
                <p id="PH">нет данных</p>
                <br>
                <p>Текущее показание:</p>
            </div>
            <div>
                <input maxlength="15" required type="text" id="newPH" v-model="PH" inputmode="decimal" placeholder="0,000"><br>
                <button @click="NewPH">Передать</button><br>
                <button onclick="main()">Выход</button>
            </div>
        </div>
        <script src="./app.js"></script>

        <script>
            function formatWithThousands(value) {
                if (!value && value !== 0) return '';
                const str = String(value).trim();
                if (!str) return '';
                if (/[,\.]\d+/.test(str)) {
                return str.replace('.', ',');
                }
                if (/^\d+$/.test(str)) {
                return `${str},000`;
                }
                return str.replace('.', ',');
            }
            document.addEventListener('DOMContentLoaded', () => {
                const inputPH = document.getElementById('newPH');
                if (inputPH) {
                    inputPH.addEventListener('blur', (e) => {
                        e.target.value = formatWithThousands(e.target.value);
                    });
                    inputPH.addEventListener('input', (e) => {
                        e.target.value = e.target.value.replace(/[^0-9,\.]/g, '');
                    });
                }
            });
        </script>

        <script>
            window.addEventListener('DOMContentLoaded', async () => {
                const authData = JSON.parse(sessionStorage.getItem('authData'));
                const phoneElement = document.getElementById('phone');
                const errorContainer = document.getElementById('error');
                const ph = document.getElementById('PH');
                if (!authData) {
                    showError('Сессия не найдена');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }                   
                if (!authData.phone || !authData.token) {
                    showError('Некорректные данные сессии');
                    clearSession();
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }  
                loadMeterData();                            
            });

            async function loadMeterData() {
                const selectedMeter = getSelectedMeter();
                const storedMeterData = sessionStorage.getItem('meternum');
                const meterData = selectedMeter || (storedMeterData ? JSON.parse(storedMeterData) : null);
                const meterNumElement = document.getElementById('meterNum');
                const errorElement = document.getElementById('error');
                errorElement.style.color = 'red';
                const ph = document.getElementById('PH');
                if (meterData?.meterNum) {
                    meterNumElement.textContent = meterData.meterNum;
                    sessionStorage.setItem('activeMeter', JSON.stringify(meterData));
                } else {
                    meterNumElement.textContent = 'Не указан';
                }
                if (storedMeterData) {
                    try {
                        const meterObj = JSON.parse(storedMeterData);
                        const mNum = meterObj.meterNum || 'Не указан';
                        meterNumElement.textContent = mNum;
                    } catch (e) {
                        console.error("Ошибка данных счетчика:", e);
                        errorElement.textContent = 'Ошибка формата данных счетчика';
                    }
                } else {
                    console.log("Данные счетчика не найдены");
                    meterNumElement.textContent = 'Не указан';
                }

            }
            function main() {                
                const now = Date.now();                 
                window.location.href = 'main.html';
            }
            function showError(message) {
                const errorContainer = document.getElementById('error');
                errorContainer.innerHTML = `<div style="color: red;">${message}</div>`;
            }
        </script>

        <script>
            async function loadPreviousPHFromAPI() {
                const phElement = document.getElementById('PH');
                if (!phElement) return;          
                const meterData = JSON.parse(sessionStorage.getItem('meternum') || '{}');
                const meter_id = meterData.meterNum;              
                if (!meter_id) {
                    phElement.textContent = 'нет данных';
                    return;
                }              
                try {
                    const response = await fetch(`http://localhost:3000/PH/last?meter_id=${meter_id}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                    });                 
                    const result = await response.json();                   
                    if (result.found && result.ph) {
                    phElement.textContent = result.ph;
                    sessionStorage.setItem('ph', JSON.stringify({ PH: result.ph }));
                    } else {
                    phElement.textContent = 'нет данных';
                    }
                } catch (err) {
                    console.error('Failed to load previous PH:', err);
                    phElement.textContent = 'нет данных';
                }
            }
            window.addEventListener('DOMContentLoaded', () => {
                loadMeterData();
                loadPreviousPHFromAPI(); 
            });
        </script>
    </body>

    <style>
        body 
        {
            margin: 0;
            color: goldenrod;
            background-color: rgb(56, 54, 54);
            font-size: 24px;
            justify-content: center;
            justify-items: center;
        }
        button 
        {
            background-color: aqua;
            width: 177px;
        }
        div 
        {
            justify-content: center;

        }
        p 
        {
            color: blueviolet;
            justify-content: center;

            word-break: break-all;
            white-space: nowrap;
        }
        input
        {
            background-color: aquamarine;
            color: rgb(0, 0, 0);
            justify-content: right;
            justify-items: right;
        }
    </style>
</html>
