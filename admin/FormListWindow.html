<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формирование списка</title>
    <link rel="icon" href="data:,">
    <script src="./vendor/vue.global.js"></script>
    <script src="./apiadmin.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Редактирование списка</h1>
      <div class="top-layout">
        <div class="left-column">
          <h3 class="section-title">Параметры формирования</h3>
          <div class="form-group">
            <label for="streetInput" class="form-label">Улица</label>
            <div class="custom-datalist" :class="{ disabled: isLoading || streets.length === 0 }">
              <div class="custom-datalist-input-wrapper">
                <input type="text" id="streetInput" placeholder="Введите улицу" autocomplete="off"
                  v-model="streetSearch" class="form-input custom-datalist-input"
                  :disabled="isLoading || streets.length === 0"
                  @focus="isStreetOpen = true" @blur="closeStreet" @input="isStreetOpen = true">
                <span v-if="streetSearch" class="clear-input-btn" @mousedown.prevent="clearStreet">✕</span>
                <span class="custom-datalist-arrow" :class="{ open: isStreetOpen }">▼</span>
              </div>
              <div v-if="isStreetOpen && filteredStreets.length" class="custom-datalist-dropdown">
                <div v-for="street in filteredStreets" :key="street.id"
                  class="custom-datalist-option"
                  @mousedown.prevent="selectStreet(street)">{{ street.name }}</div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="checkbox-row">
              <label class="form-label">Диапазон домов</label>
              <label class="checkbox-label-inline">
                <input type="checkbox" v-model="allHouses" class="form-checkbox">
                <span class="checkbox-text">все дома</span>
              </label>
            </div>
            <div class="range-row">
              <input type="text" v-model="houseFrom" placeholder="от" class="form-input range-input" :disabled="isLoading || allHouses">
              <span class="range-sep">—</span>
              <input type="text" v-model="houseTo" placeholder="до" class="form-input range-input" :disabled="isLoading || allHouses">
            </div>
          </div>
          <div class="form-group">
            <div class="checkbox-row">
              <label class="form-label">Последняя передача показаний</label>
              <label class="checkbox-label-inline">
                <input type="checkbox" v-model="allTimeReadings" class="form-checkbox">
                <span class="checkbox-text">за всё время</span>
              </label>
            </div>
            <div class="range-row">
              <input type="date" v-model="lastIndFrom" class="form-input range-input" :disabled="isLoading || allTimeReadings">
              <span class="range-sep">—</span>
              <input type="date" v-model="lastIndTo" class="form-input range-input" :disabled="isLoading || allTimeReadings">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Срок поверки</label>
            <select v-model="verifyFilter" class="form-input" :disabled="isLoading">
              <option value="">Все</option>
              <option value="expired">С истёкшим сроком</option>
              <option value="valid">С действующим сроком</option>
            </select>
          </div>
          <button type="button" class="btn-primary" @click="buildList" :disabled="isLoading || !streetSearch">
            {{ isLoading ? 'Загрузка...' : 'Подтвердить' }}
          </button>
        </div>
        <div class="right-column">
          <h3 class="section-title">
            Список адресов
            <span v-if="addressList.length" class="counter">({{ addressList.length }})</span>
          </h3>
          <div v-if="!listLoaded" class="empty-state">
              
          </div>
          <div v-else-if="addressList.length === 0" class="empty-state">
            По заданным параметрам адресов не найдено
          </div>
          <div v-else class="address-table-wrapper">
            <table class="address-table">
              <thead>
                <tr>
                  <th>Адрес</th>
                  <th>ФИО</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="addr in addressList" :key="addr.meterId"
                  :class="{ selected: selectedMeterId === addr.meterId }"
                  @click="selectAddressRow(addr)">
                  <td>{{ addr.address }}</td>
                  <td>{{ addr.fio }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div v-if="selectedMeterId" class="details-block">
        <h3 class="section-title">Данные объекта</h3>
        <div v-if="detailsLoading" class="empty-state">Загрузка данных...</div>
        <div v-else class="details-grid">
          <div class="details-col">
            <div class="detail-field">
              <label class="detail-label">Лицевой счёт</label>
              <input type="text" v-model="details.licschet" class="edit-input" readonly>
            </div>
            <div class="detail-field">
              <label class="detail-label">Адрес</label>
              <input type="text" v-model="details.address" class="edit-input" readonly>
            </div>
            <div class="detail-field">
              <label class="detail-label">ФИО</label>
              <input type="text" v-model="details.fio" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Телефон</label>
              <input type="text" v-model="details.clientPhone" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Почта</label>
              <input type="text" v-model="details.clientMail" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Последнее показание</label>
              <input type="text" v-model="details.lastPh" class="edit-input" readonly>
            </div>
          </div>
          <div class="details-col">
            <div class="detail-field">
              <label class="detail-label">Дата проверки</label>
              <input type="date" v-model="details.verifyDate" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Ответственный контролёр</label>
              <select v-model="details.controllerId" class="edit-input" :disabled="saving">
                <option :value="null">Нет</option>
                <option v-for="c in details.controllers" :key="c.id" :value="c.id">{{ c.fio }}</option>
              </select>
            </div>
            <div class="detail-field">
              <label class="detail-label">Услуга</label>
              <select v-model="details.serviceId" class="edit-input" :disabled="saving">
                <option :value="null">—</option>
                <option v-for="s in details.services" :key="s.id" :value="s.id">{{ s.name }}</option>
              </select>
            </div>
            <div class="detail-field">
              <label class="detail-label">Номер счётчика</label>
              <input type="text" v-model="details.meterNum" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Номер пломбы</label>
              <input type="text" v-model="details.seal" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Статус бойлера</label>
              <input type="text" v-model="details.boilerStatus" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Дата изготовления</label>
              <input type="date" v-model="details.manfDate" class="edit-input" :disabled="saving">
            </div>
            <div class="detail-field">
              <label class="detail-label">Дата установки</label>
              <input type="date" v-model="details.mountDate" class="edit-input" :disabled="saving">
            </div>
          </div>
        </div>
        <div class="details-actions">
          <button type="button" class="save-btn" :disabled="saving" @click="saveDetails">
            {{ saving ? 'Сохранение...' : 'Сохранить' }}
          </button>
          <p v-if="saveMessage" :class="['save-message', saveMessageType]">{{ saveMessage }}</p>
        </div>
      </div>
      <button type="button" class="btn-secondary" style="margin-top: 20px;" @click="logout">Выход</button>
      <div class="status" id="statusDiv"></div>
    </div>
  </body>
    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        createApp({
            setup() {
            const isLoading = ref(false);
            const saving = ref(false);
            const streets = ref([]);
            const streetSearch = ref('');
            const selectedStreetId = ref(null);
            const isStreetOpen = ref(false);
            const houseFrom = ref('');
            const houseTo = ref('');
            const allHouses = ref(false);
            const lastIndFrom = ref('');
            const lastIndTo = ref('');
            const allTimeReadings = ref(false);
            const verifyFilter = ref('');
            const listLoaded = ref(false);
            const addressList = ref([]);
            const selectedMeterId = ref(null);
            const detailsLoading = ref(false);
            const details = ref({
              meterId: null, licschet: '', address: '', verifyDate: '',
              fio: '', clientId: null, clientPhone: '', clientMail: '',
              controllerId: null, serviceId: null, seal: '', boilerStatus: '',
              lastPh: '', manfDate: '', mountDate: '', meterNum: '',
              services: [], controllers: []
            });
            const saveMessage = ref('');
            const saveMessageType = ref('success');
            watch(allHouses, (newVal) => {
              if (!newVal) {
                houseFrom.value = '';
                houseTo.value = '';
              }
            });
            watch(allTimeReadings, (newVal) => {
              if (newVal) {
                lastIndFrom.value = '';
                lastIndTo.value = '';
              }
            });            
            const filteredStreets = computed(() => {
              if (!streetSearch.value) return streets.value;
              const term = streetSearch.value.toLowerCase();
              return streets.value.filter(s => s.name.toLowerCase().includes(term));
            });
            const loadStreets = async () => {
              isLoading.value = true;
              try {
                const data = await apiRequest('/all-streets', {});
                streets.value = Array.isArray(data) ? data : [];
              } catch (e) {
                console.error('Failed to load streets:', e);
              } finally {
                isLoading.value = false;
              }
            };
            const selectStreet = (street) => {
              streetSearch.value = street.name;
              selectedStreetId.value = street.id;
              isStreetOpen.value = false;
            };
            const closeStreet = () => {
              isStreetOpen.value = false;
              if (streetSearch.value && !streets.value.find(s => s.name === streetSearch.value)) {
                selectedStreetId.value = null;
                streetSearch.value = '';
              }
            };
            const clearStreet = () => {
              streetSearch.value = '';
              selectedStreetId.value = null;
              isStreetOpen.value = false;
            };
            const buildList = async () => {
              if (!selectedStreetId.value) {
                alert('Выберите улицу');
                return;
              }
              isLoading.value = true;
              listLoaded.value = false;
              addressList.value = [];
              selectedMeterId.value = null;
              try {
                const data = await apiRequest('/addresses-by-params', {
                  streetId: selectedStreetId.value,
                  houseFrom: houseFrom.value,
                  houseTo: houseTo.value,
                  lastIndDateFrom: lastIndFrom.value,
                  lastIndDateTo: lastIndTo.value,
                  verifyFilter: verifyFilter.value
                });
                addressList.value = Array.isArray(data) ? data : [];
                listLoaded.value = true;
              } catch (e) {
                console.error(e);
                alert('Ошибка загрузки списка: ' + (e.message || ''));
              } finally {
                isLoading.value = false;
              }
            };
            const selectAddressRow = async (addr) => {
              selectedMeterId.value = addr.meterId;
              detailsLoading.value = true;
              saveMessage.value = '';
              try {
                const data = await apiRequest('/meter-full-details', { meterId: addr.meterId });
                details.value = {
                  meterId: data.meterId,
                  licschet: data.licschet || '',
                  address: data.address || '',
                  verifyDate: data.verifyDate || '',
                  fio: data.fio || '',
                  clientId: data.clientId,
                  clientPhone: data.clientPhone || '',
                  clientMail: data.clientMail || '',
                  controllerId: data.controllerId,
                  serviceId: data.serviceId,
                  seal: data.seal || '',
                  boilerStatus: data.boilerStatus || '',
                  lastPh: data.lastPh || '',
                  manfDate: data.manfDate || '',
                  mountDate: data.mountDate || '',
                  meterNum: data.meterNum || '',
                  services: data.services || [],
                  controllers: data.controllers || []
                };
              } catch (e) {
                console.error(e);
                alert('Ошибка загрузки деталей');
              } finally {
                detailsLoading.value = false;
              }
            };
            const saveDetails = async () => {
              if (!details.value.meterId) return;
              saving.value = true;
              saveMessage.value = '';
              try {
                await apiRequest('/update-meter-full', {
                  meterId: details.value.meterId,
                  meterNum: details.value.meterNum,
                  seal: details.value.seal,
                  manfDate: details.value.manfDate,
                  mountDate: details.value.mountDate,
                  verifyDate: details.value.verifyDate,
                  controllerId: details.value.controllerId,
                  serviceId: details.value.serviceId,
                  fio: details.value.fio,
                  clientPhone: details.value.clientPhone,
                  clientMail: details.value.clientMail,
                  boilerStatus: details.value.boilerStatus
                });
                saveMessage.value = 'Данные сохранены';
                saveMessageType.value = 'success';
                const row = addressList.value.find(a => a.meterId === details.value.meterId);
                if (row) row.fio = details.value.fio || 'ФИО не указано';
              } catch (e) {
                saveMessage.value = 'Ошибка: ' + (e.message || 'Неизвестная ошибка');
                saveMessageType.value = 'error';
              } finally {
                saving.value = false;
              }
            };
            const logout = () => {
              window.location.href = 'adminActWindow.html';
            };
            onMounted(() => {
              loadStreets();
            });
            return {
              isLoading, saving, streets, streetSearch, selectedStreetId,
              isStreetOpen, houseFrom, houseTo, allHouses, lastIndFrom, lastIndTo, verifyFilter,
              listLoaded, addressList, selectedMeterId, allTimeReadings,
              detailsLoading, details, saveMessage, saveMessageType,
              filteredStreets,
              selectStreet, closeStreet, clearStreet,
              buildList, selectAddressRow, saveDetails, logout
            };
          }
        }).mount('#app');
    </script>
  <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(() => statusDiv.classList.add("status-hidden"), 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения к сети";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(() => statusDiv.classList.add("status-hidden"), 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
  <style>

        display: flex;
        justify-content: space-between;

      }

    }
