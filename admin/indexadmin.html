<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="WIN1251">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="icon" href="data:,">
    <script src="./vendor/vue.global.js"></script>
    <script src="./apiadmin.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>Вход</h1>       
      <form @submit.prevent="login" class="form-container">
        <input type="text" name="passwd" autocomplete="passwd" style="display:none;" tabindex="-1" aria-hidden="true">
        <input 
          v-model="password" 
          type="password" 
          placeholder="Пароль"
          maxlength="15" 
          required
          class="form-input"
          autocomplete="off"
        />     
        <div class="button-group">
          <button type="submit" class="btn-primary">Войти</button>
        </div>                    
        <p v-if="response" class="response-message">{{ response }}</p>
        <p v-if="error" class="error-message">{{ error }}</p>
        <div class="status" id="statusDiv"></div>  
      </form>
    </div>  
    <script src="./appadmin.js"></script>   
    <script>
      let statusTimeout;    
      let isInitialLoad = true;
      function updateStatus(isOnline) {
        var statusDiv = document.getElementById("statusDiv");
        if (!statusDiv) return;
        clearTimeout(statusTimeout);
        if (isOnline) {
          if (!isInitialLoad) {
            statusDiv.style.backgroundColor = "#44ff00";
            statusDiv.textContent = "Подключено";
            statusDiv.classList.remove("status-hidden");        
            statusTimeout = setTimeout(function() {
              statusDiv.classList.add("status-hidden");
            }, 5000);
          }
        } else {
          statusDiv.style.backgroundColor = "#ff0007";
          statusDiv.textContent = "Нет подключения";
          statusDiv.classList.remove("status-hidden");
          statusTimeout = setTimeout(function() {
            statusDiv.classList.add("status-hidden");
          }, 5000);
        }
        isInitialLoad = false;
      }   
      updateStatus(navigator.onLine);
      window.addEventListener("online", () => updateStatus(true));
      window.addEventListener("offline", () => updateStatus(false));
    </script>
  </body>  
  <style>
   * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .status {    
      position: fixed;
      bottom: 0;      
      left: 0;        
      right: 0;       
      width: 100%;    
      text-align: center;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 0;
      z-index: 1000;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: translateY(0);
      opacity: 1;
    }
      
    .status.status-hidden {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none; 
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000000;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
      color: #000000;
    }

    .form-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      color: #000000;
      background-color: #FFFFFF;
      border: 2px solid #45B0E1;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-input::placeholder {
      color: #666666;
    }

    .form-input:focus {
      border-color: #2E8BC0;
      background-color: #F8FDFF;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      color: #FFFFFF;
      background-color: #45B0E1;
      border: 2px solid #45B0E1;
      border-radius: 0;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      text-align: center;
    }

    button:hover {
      background-color: #2E8BC0;
      border-color: #2E8BC0;
    }

    button:active {
      background-color: #1A6B96;
      border-color: #1A6B96;
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: #45B0E1;
      border: 2px solid #45B0E1;
    }

    .btn-secondary:hover {
      background-color: #F0F9FC;
    }

    .response-message {
      color: #2E7D32;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    .error-message {
      color: #C62828;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      h1 {
        font-size: 24px;
        margin-bottom: 24px;
      }
      
      .form-input,
      button {
        padding: 14px 16px;
        font-size: 16px;
      }
      
      .form-container {
        max-width: 100%;
      }
    }

    @media (min-width: 768px) {
      body {
        padding: 40px 24px;
      }
      
      h1 {
        font-size: 32px;
        margin-bottom: 40px;
      }
      
      .form-container {
        max-width: 520px;
        gap: 24px;
      }
      
      .form-input {
        padding: 18px 24px;
        font-size: 17px;
      }
      
      button {
        padding: 18px 24px;
        font-size: 17px;
      }
      
      .button-group {
        gap: 20px;
        margin-top: 16px;
      }
    }

    @media (min-width: 1200px) {
      .form-container {
        max-width: 560px;
      }
      
      .form-input {
        padding: 20px 28px;
      }
      
      button {
        padding: 20px 28px;
      }
    }

    .server-response {
      white-space: pre-line;
    }
  </style> 
</html>
